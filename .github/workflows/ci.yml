name: Mechanical Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mechanical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: sh -n install.sh

      - name: Skill bundle version consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          catalog = json.loads((root / "skills/catalog.json").read_text(encoding="utf-8"))
          catalog_version = catalog.get("version")

          if version != catalog_version:
              raise SystemExit(
                  f"VERSION mismatch: VERSION={version!r} catalog.version={catalog_version!r}"
              )

          mismatches = []
          for entry in catalog.get("skills", []):
              path = root / entry["path"]
              lines = path.read_text(encoding="utf-8").splitlines()
              skill_version = None
              for index, line in enumerate(lines):
                  if line != "metadata:":
                      continue
                  for child in lines[index + 1:]:
                      if child and not child.startswith("  "):
                          break
                      if child.startswith("  version:"):
                          skill_version = child.split(":", 1)[1].strip()
                          break
                  break

              if not skill_version:
                  mismatches.append(f"{entry['path']}: metadata.version missing")
                  continue
              if skill_version != catalog_version:
                  mismatches.append(
                      f"{entry['path']}: metadata.version={skill_version!r}, expected={catalog_version!r}"
                  )

          installer = (root / "install.sh").read_text(encoding="utf-8")
          match = re.search(r"(?m)^runtime_skills='([^']*)'$", installer)
          if not match:
              mismatches.append("install.sh: runtime_skills bootstrap mirror missing")
          else:
              installer_names = match.group(1).split()
              catalog_names = [entry.get("name") for entry in catalog.get("skills", [])]
              if installer_names != catalog_names:
                  mismatches.append(
                      "install.sh runtime_skills differs from catalog order/names: "
                      f"{installer_names!r} != {catalog_names!r}"
                  )

          for entry in catalog.get("skills", []):
              name = entry.get("name")
              expected_path = f"skills/{name}/SKILL.md"
              if entry.get("path") != expected_path:
                  mismatches.append(
                      f"catalog path for {name!r} is {entry.get('path')!r}, "
                      f"but installer expects {expected_path!r}"
                  )

          if mismatches:
              raise SystemExit("Skill bundle packaging mismatch:\n" + "\n".join(mismatches))

          print(f"Skill bundle packaging metadata consistent: {catalog_version}")
          PY

      - name: Whitespace
        run: git diff --check HEAD^ HEAD
