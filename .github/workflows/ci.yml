name: Mechanical Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mechanical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: sh -n install.sh

      - name: Whitespace
        run: git diff --check HEAD^ HEAD
