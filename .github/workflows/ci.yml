name: Mechanical Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mechanical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Installer executable mode
        shell: bash
        run: |
          set -euo pipefail
          test -f install.sh && test ! -L install.sh && test -x install.sh
          test "$(git ls-files --stage -- install.sh | awk '{print $1}')" = 100755

      - name: Shell syntax
        run: sh -n install.sh

      - name: Skill bundle version consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          catalog = json.loads((root / "skills/catalog.json").read_text(encoding="utf-8"))
          catalog_version = catalog.get("version")

          if version != catalog_version:
              raise SystemExit(
                  f"VERSION mismatch: VERSION={version!r} catalog.version={catalog_version!r}"
              )

          mismatches = []
          for entry in catalog.get("skills", []):
              path = root / entry["path"]
              lines = path.read_text(encoding="utf-8").splitlines()
              skill_version = None
              for index, line in enumerate(lines):
                  if line != "metadata:":
                      continue
                  for child in lines[index + 1:]:
                      if child and not child.startswith("  "):
                          break
                      if child.startswith("  version:"):
                          skill_version = child.split(":", 1)[1].strip()
                          break
                  break

              if not skill_version:
                  mismatches.append(f"{entry['path']}: metadata.version missing")
                  continue
              if skill_version != catalog_version:
                  mismatches.append(
                      f"{entry['path']}: metadata.version={skill_version!r}, expected={catalog_version!r}"
                  )

          installer = (root / "install.sh").read_text(encoding="utf-8")
          match = re.search(r"(?m)^runtime_skills='([^']*)'$", installer)
          if not match:
              mismatches.append("install.sh: runtime_skills bootstrap mirror missing")
          else:
              installer_names = match.group(1).split()
              catalog_names = [entry.get("name") for entry in catalog.get("skills", [])]
              if installer_names != catalog_names:
                  mismatches.append(
                      "install.sh runtime_skills differs from catalog order/names: "
                      f"{installer_names!r} != {catalog_names!r}"
                  )

          for entry in catalog.get("skills", []):
              name = entry.get("name")
              expected_path = f"skills/{name}/SKILL.md"
              if entry.get("path") != expected_path:
                  mismatches.append(
                      f"catalog path for {name!r} is {entry.get('path')!r}, "
                      f"but installer expects {expected_path!r}"
                  )

          if mismatches:
              raise SystemExit("Skill bundle packaging mismatch:\n" + "\n".join(mismatches))

          print(f"Skill bundle packaging metadata consistent: {catalog_version}")
          PY

      - name: Whitespace over the complete change
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_exists() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$1^{commit}"
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              commit_exists "$PR_BASE_SHA"
              commit_exists "$PR_HEAD_SHA"
              test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
              base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
              ;;
            push)
              commit_exists "$EVENT_SHA"
              test "$(git rev-parse HEAD)" = "$EVENT_SHA"
              if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
                base=$(git hash-object -t tree --stdin </dev/null)
              else
                # Missing history is an error, not permission to inspect HEAD^ only.
                commit_exists "$PUSH_BEFORE"
                base=$PUSH_BEFORE
              fi
              ;;
            *) echo "Unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          printf 'Checked base: %s\nChecked head: %s\n' "$base" "$(git rev-parse HEAD)"
          git diff --check "$base" HEAD

  mechanical-gate:
    name: Mechanical result gate
    if: ${{ always() }}
    needs: mechanical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require actual mechanical success
        shell: bash
        env:
          MECHANICAL_RESULT: ${{ needs.mechanical.result }}
        run: |
          set -euo pipefail
          test "$MECHANICAL_RESULT" = success
          echo "Mechanical checks succeeded; AI review and host acceptance are separate evidence." >> "$GITHUB_STEP_SUMMARY"
