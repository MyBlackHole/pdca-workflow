            "$RUNNER_TEMP/bounded-counter-label-child-context.md" <<'PY'
          import json
          import pathlib
          import re
          import sys

          identifier_pattern = re.compile(r"(?<![A-Za-z0-9_-])[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+(?![A-Za-z0-9_-])")
          fixture_identifiers = set(identifier_pattern.findall(
              pathlib.Path(sys.argv[6]).read_text(encoding="utf-8")
          ))
          if not fixture_identifiers:
              raise SystemExit("child-context fixture has no identifier-like tokens")

          def response_identifiers(value):
              if isinstance(value, str):
                  return set(identifier_pattern.findall(value))
              if isinstance(value, dict):
                  return set().union(*(
                      response_identifiers(key) | response_identifiers(item)
                      for key, item in value.items()
                  ))
              if isinstance(value, list):
                  return set().union(*(response_identifiers(item) for item in value))
              return set()

          expected_constraints = {"C-LABEL", "C-LABEL-INPUT"}
          expected_interface_contract = {
              "legal_reading_range": [0, 2],
              "formatter_preserves_value_as_label": True,
              "concrete_operation_mapping": "unknown",
              "read_invocation_count_policy": "unknown",
              "freshness_reuse_policy": "unknown",
              "read_result_contract": "unknown",
              "negative_boundary_observability": "unknown",
          }
          expected_unknowns = {
              "U-OPERATION-RETURN-CONTRACT",
              "U-LABEL-READ-MAPPING",
              "U-LABEL-REJECTION-OBSERVABILITY",
          }
          expected_requirements = {"REQ-LABEL-001", "REQ-COMP-001", "REQ-MODEL-SHAPE-001"}
          expected_root_scope_boundary = {
              "uncovered_requirement": "REQ-SCOPE-001",
              "unknown": "U-PERSISTENCE-SCOPE",
              "root_coverage_blocked": True,
              "local_label_impact": "unknown",
          }
          excluded_expected = {
              "counter_increment_semantics": "not_in_context",
              "counter_reset_semantics": "not_in_context",
              "parent_activity_history": "not_in_context",
              "sibling_full_context": "not_in_context",
          }

          def load_run(path):
              events = []
              for line_number, line in enumerate(pathlib.Path(path).read_text(encoding="utf-8").splitlines(), start=1):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f"{path}:{line_number}: invalid OpenCode JSONL event: {exc}")

              skill_parts = []
              tool_names = []
              texts = []
              session_ids = set()
              for event in events:
                  sid = event.get("sessionID")
                  if isinstance(sid, str):
                      session_ids.add(sid)
                  if event.get("type") == "tool_use":
                      part = event.get("part") or {}
                      tool = part.get("tool")
                      tool_names.append(tool)
                      if tool == "skill":
                          skill_parts.append(part)
                  if event.get("type") == "text":
                      part = event.get("part") or {}
                      value = part.get("text")
                      if isinstance(value, str) and value.strip():
                          texts.append(value.strip())

              if not skill_parts or not any("pdca" in json.dumps(p, ensure_ascii=False).lower() for p in skill_parts):
                  raise SystemExit(f"{path}: pdca skill tool call missing")
              unexpected_tools = [tool for tool in tool_names if tool != "skill"]
              if unexpected_tools:
                  raise SystemExit(f"{path}: unexpected tool access outside supplied context: {unexpected_tools}")
              if tool_names.count("skill") != 1:
                  raise SystemExit(f"{path}: expected exactly one skill tool call, got {tool_names}")
              if len(session_ids) != 1:
                  raise SystemExit(f"{path}: expected one session id, got {sorted(session_ids)}")
              if not texts:
                  raise SystemExit(f"{path}: no final text")

              final = texts[-1]
              try:
                  obj = json.loads(final)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{path}: final answer must be exactly one JSON object: {exc}: {final!r}")
              if not isinstance(obj, dict):
                  raise SystemExit(f"{path}: final JSON value must be an object, got {type(obj).__name__}")

              unsupported = response_identifiers(obj) - fixture_identifiers
              if unsupported:
                  raise SystemExit(f"{path}: identifiers absent from child context: {sorted(unsupported)}")

              expected_keys = {
                  "current_node", "work_instance", "responsibility", "input_interface",
                  "producer_endpoint", "interface_contract", "unknowns", "constraints", "requirements", "dependency_ready",
                  "root_scope_boundary", "excluded", "limitations",
              }
              if set(obj) != expected_keys:
                  raise SystemExit(f"{path}: unexpected keys: {sorted(obj)}")
              if obj["current_node"] != "NODE-LABEL" or obj["work_instance"] != "INST-LABEL":
                  raise SystemExit(f"{path}: wrong current-node identity: {obj!r}")
              if obj["input_interface"] != "legal_count_value" or obj["producer_endpoint"] != "INST-COUNTER":
                  raise SystemExit(f"{path}: wrong dependency endpoint/interface: {obj!r}")
              if obj["interface_contract"] != expected_interface_contract:
                  raise SystemExit(f"{path}: interface contract mismatch: {obj.get('interface_contract')!r}")
              if (not isinstance(obj["interface_contract"].get("legal_reading_range"), list)
                      or len(obj["interface_contract"]["legal_reading_range"]) != 2
                      or not all(type(item) is int for item in obj["interface_contract"]["legal_reading_range"])):
                  raise SystemExit(f"{path}: legal_reading_range must contain JSON integers")
              if type(obj["interface_contract"].get("formatter_preserves_value_as_label")) is not bool:
                  raise SystemExit(f"{path}: formatter_preserves_value_as_label must be a JSON boolean")
              if (not isinstance(obj["unknowns"], list)
                      or len(obj["unknowns"]) != len(expected_unknowns)
                      or not all(isinstance(item, str) for item in obj["unknowns"])
                      or set(obj["unknowns"]) != expected_unknowns):
                  raise SystemExit(f"{path}: interface unknowns mismatch: {obj['unknowns']!r}")
              if (not isinstance(obj["constraints"], list)
                      or len(obj["constraints"]) != len(expected_constraints)
                      or not all(isinstance(item, str) for item in obj["constraints"])
                      or set(obj["constraints"]) != expected_constraints):
                  raise SystemExit(f"{path}: wrong constraints: {obj['constraints']!r}")
              if (not isinstance(obj["requirements"], list)
                      or len(obj["requirements"]) != len(expected_requirements)
                      or not all(isinstance(item, str) for item in obj["requirements"])
                      or set(obj["requirements"]) != expected_requirements):
                  raise SystemExit(f"{path}: wrong requirements: {obj['requirements']!r}")
              root_scope_boundary = obj["root_scope_boundary"]
              if not isinstance(root_scope_boundary, dict) or type(root_scope_boundary.get("root_coverage_blocked")) is not bool:
                  raise SystemExit(f"{path}: root_scope_boundary.root_coverage_blocked must be a JSON boolean")
              if obj["root_scope_boundary"] != expected_root_scope_boundary:
                  raise SystemExit(f"{path}: root-scope boundary mismatch: {obj['root_scope_boundary']!r}")
              if obj["dependency_ready"] is not False:
                  raise SystemExit(f"{path}: dependency must remain not ready")
              if not isinstance(obj["excluded"], dict) or obj["excluded"] != excluded_expected:
                  raise SystemExit(f"{path}: excluded-context contract violated: {obj['excluded']!r}")
              if not isinstance(obj["responsibility"], str) or not obj["responsibility"].strip():
                  raise SystemExit(f"{path}: responsibility missing")
              if (not isinstance(obj["limitations"], list) or not obj["limitations"]
                      or not all(isinstance(item, str) and item.strip() for item in obj["limitations"])):
                  raise SystemExit(f"{path}: limitations must be a nonempty list of nonempty strings")

              normalized = {
                  "current_node": obj["current_node"],
                  "work_instance": obj["work_instance"],
                  "input_interface": obj["input_interface"],
                  "producer_endpoint": obj["producer_endpoint"],
                  "interface_contract": obj["interface_contract"],
                  "unknowns": sorted(obj["unknowns"]),
                  "constraints": sorted(obj["constraints"]),
                  "requirements": sorted(obj["requirements"]),
                  "root_scope_boundary": expected_root_scope_boundary,
                  "dependency_ready": obj["dependency_ready"],
                  "excluded": obj["excluded"],
              }
              return next(iter(session_ids)), normalized, obj

          sid1, norm1, raw1 = load_run(sys.argv[1])
          sid2, norm2, raw2 = load_run(sys.argv[2])
          if sid1 == sid2:
              raise SystemExit(f"child-context runs reused session id {sid1}")
          if norm1 != norm2:
              raise SystemExit(f"child-context normalized semantics differ: {norm1!r} != {norm2!r}")

          summary = {
              "run1": {
                  "session_id": sid1,
                  "model": pathlib.Path(sys.argv[3]).read_text().strip(),
                  "answer": raw1,
              },
              "run2": {
                  "session_id": sid2,
                  "model": pathlib.Path(sys.argv[4]).read_text().strip(),
                  "answer": raw2,
              },
              "normalized_context_semantics": norm1,
              "same_semantics": True,
              "different_sessions": True,
              "excluded_context_respected": True,
              "tool_boundary_respected": True,
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("two fresh OpenCode sessions respected the same minimum label-child context")
          PY

      - name: Probe explicit OpenCode session continuation
        if: steps.scope.outputs.run_model_probes == 'true'
        id: session_continuity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
