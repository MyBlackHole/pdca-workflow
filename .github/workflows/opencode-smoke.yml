          cat >"$RUNNER_TEMP/bounded-counter-label-child-context.md" <<'EOF'
          # Synthetic pre-H18 label-child minimum context

          This file is a test-only CONTEXT-01 selection derived from bounded-counter candidate-0.9.0.
          It is not a fixed assignment record and does not make the candidate a formal node.

          ## Current candidate node

          - model revision: candidate-0.9.0
          - node identity: NODE-LABEL
          - ontology/work ref: INST-LABEL
          - responsibility: format a legal count reading
          - input: legal_count_value
          - output: exact label text
          - constraints: C-LABEL, C-LABEL-INPUT
          - parent composition: REL-COMP-SYSTEM-LABEL
          - dependency: REL-CONSUMES-LEGAL-READING
          - acceptance:
            - legal inputs 0,1,2 map exactly to count=0,count=1,count=2
            - a legal reading N in [0,2] is represented as `count=N`; concrete operation mapping and read invocation/reuse policy remain unknown under U-LABEL-READ-MAPPING
          - oracle: reject if a legal reading is formatted as a different number; assess an out-of-range rejection only when a permitted observable boundary exists, otherwise retain U-LABEL-REJECTION-OBSERVABILITY

          ## Definition and work instance

          DEF-LABEL:
          - semantic kind: stateless component
          - responsibility: map a legal count value N to the exact text count=N
          - input: legal count value
          - output: label text

          INST-LABEL:
          - instance_of: DEF-LABEL

          ## Parent boundary

          INST-SYSTEM:
          - role in this context: direct aggregate parent identity only

          REL-COMP-SYSTEM-LABEL:
          - source: INST-SYSTEM
          - target: INST-LABEL
          - shared interface: system supplies a legal count value and receives exact label text
          - shared invariant: label behavior satisfies C-LABEL and C-LABEL-INPUT
          - parent composition responsibility: aggregate guarantees that legal counter readings can be represented as labels

          ## Required dependency endpoint

          INST-COUNTER:
          - role in this context: producer endpoint identity only
          - required producer operation: unspecified; `legal_count_value` denotes the semantic value of a legal reading, while concrete operation mapping and result contracts remain unknown
          - internal counter state and implementation details are intentionally not included

          REL-CONSUMES-LEGAL-READING:
          - source: INST-COUNTER
          - target: INST-LABEL
          - producer/consumer direction: INST-COUNTER -> INST-LABEL
          - interface: legal_count_value
          - interface revision: candidate-0.9.0
          - interface contract: semantic value N in [0,2] that the formatter represents as `count=N`; concrete operation mapping, invocation count, freshness, and reuse are unknown
          - `read()` return semantics remain unknown under U-OPERATION-RETURN-CONTRACT
          - consumer interpretation: label responsibility depends on this producer/interface
          - fixed deliverable version/digest: not_fixed
          - ready evidence: none
          - ready: false

          ## Constraints

          C-LABEL:
          - subject: INST-LABEL
          - predicate: for legal N, output is exactly count=N
          - applicability: N in [0,2]
          - requirement: REQ-LABEL-001

          C-LABEL-INPUT:
          - subject: REL-CONSUMES-LEGAL-READING
          - predicate: every formatter input represents a legal reading N in [0,2], and the output represents the same N as `count=N`; concrete operation mapping and call/reuse policy are unknown
          - expected invariant: each label represents only a legal reading value and preserves its semantic number in the formatted text
          - observation signal: pair an available legal reading value N with formatter output `count=N`; do not infer a specific operation, call count, freshness, or reuse policy
          - requirement: REQ-COMP-001

          ## Requirements

          REQ-LABEL-001:
          - legal counter reading N is represented as count=N

          REQ-COMP-001:
          - label formatting consumes only a legal counter reading

          REQ-MODEL-SHAPE-001:
          - statement: Counter state and label representation are separately described by inputs, outputs, constraints, and rejectable conditions.
          - classification: root-model requirement
          - projection in this child: the label-side inputs, outputs, constraints, and rejectable conditions are included above
          - counter boundary: INST-COUNTER remains a producer endpoint only; counter state and internal definitions/behavior remain excluded

          ## Unresolved root-scope boundary

          - source phrase: 无持久化的示例
          - uncovered root requirement: REQ-SCOPE-001
          - unresolved root unknown: U-PERSISTENCE-SCOPE
          - unresolved operation/mapping unknowns: U-OPERATION-RETURN-CONTRACT, U-LABEL-READ-MAPPING, U-LABEL-REJECTION-OBSERVABILITY
          - root coverage claim: blocked
          - impact on local label behavior: unknown
          - this context does not establish whether the phrase constrains local label behavior

          ## Explicitly excluded from this initial context

          - DEF-COUNTER full definition
          - counter increment semantics and C-INC
          - counter reset semantics and C-RESET
          - counter initialization details C-INIT
          - internal read() implementation details and state behavior beyond the current legal-reading interface boundary
          - NODE-COUNTER full work-node contract
          - sibling task conversation/history
          - parent Plan/Do/Check/Act activity history
          - unrelated ontology branches
          - implementation artifacts
          - behavior evidence

          The child may report these excluded facts as unavailable/not_in_context, but must not invent them.
          EOF

          cat >"$RUNNER_TEMP/opencode-child-context-prompt.txt" <<'EOF'
          This is a synthetic compatibility test with no private data.
          First use the OpenCode skill tool to load the skill named pdca.
          Do not modify files.
          Treat the attached file as the complete initial context for this child.
          Do not fill excluded facts from general knowledge or assumptions.
          Do not reconstruct, rename, or infer omitted identifier names or their semantics.
