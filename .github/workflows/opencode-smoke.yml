          python3 - "$RUNNER_TEMP/opencode-continuity-token.txt" <<'PY'
          import pathlib
          import secrets
          import sys

          token = "pdca-continuity-" + secrets.token_hex(16)
          pathlib.Path(sys.argv[1]).write_text(token, encoding="utf-8")
          PY

          token="$(cat "$RUNNER_TEMP/opencode-continuity-token.txt")"
          cat >"$RUNNER_TEMP/opencode-continuity-first-prompt.txt" <<EOF
          This is a synthetic OpenCode session-continuity diagnostic with no private data.
          First use the OpenCode skill tool to load the skill named pdca.
          Do not modify files and do not read/search the repository.
          Remember this opaque runtime token for the next message in this same session:

          $token

          Return exactly one JSON object with no extra prose:
          {
            "continuity_token": "$token",
            "state": "waiting_for_followup"
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          success=0
          : >"$RUNNER_TEMP/opencode-continuity-first-attempts.log"
          for model in "${models[@]}"; do
            echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
            set +e
            timeout 180 opencode run               --model "$model"               --format json               --               "$(cat "$RUNNER_TEMP/opencode-continuity-first-prompt.txt")"               >"$RUNNER_TEMP/opencode-continuity-first.jsonl"               2>"$RUNNER_TEMP/opencode-continuity-first.stderr"
            status=$?
            set -e
            cat "$RUNNER_TEMP/opencode-continuity-first.stderr" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
            if [ "$status" -eq 0 ]; then
              echo "$model" >"$RUNNER_TEMP/opencode-continuity-first.model"
              success=1
              break
            fi
            echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
          done
          [ "$success" -eq 1 ] || {
            echo "No public free model completed the first continuity turn."
            exit 1
          }

          python3 -             "$RUNNER_TEMP/opencode-continuity-first.jsonl"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-session.txt" <<'PY'
          import json
          import pathlib
          import sys

          events = []
          event_path = pathlib.Path(sys.argv[1])
          for line_number, line in enumerate(event_path.read_text(encoding="utf-8").splitlines(), start=1):
              line = line.strip()
              if not line:
                  continue
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{event_path}:{line_number}: invalid OpenCode JSONL event: {exc}")

          session_ids = {
              event.get("sessionID")
              for event in events
              if isinstance(event.get("sessionID"), str)
          }
          tool_names = []
          skill_parts = []
          texts = []
          for event in events:
              if event.get("type") == "tool_use":
                  part = event.get("part") or {}
                  tool = part.get("tool")
                  tool_names.append(tool)
                  if tool == "skill":
                      skill_parts.append(part)
              if event.get("type") == "text":
                  part = event.get("part") or {}
                  value = part.get("text")
                  if isinstance(value, str) and value.strip():
                      texts.append(value.strip())

          if len(session_ids) != 1:
              raise SystemExit(f"first turn: expected one session id, got {sorted(session_ids)}")
          if not skill_parts or not any(
              "pdca" in json.dumps(part, ensure_ascii=False).lower()
              for part in skill_parts
          ):
              raise SystemExit("first turn: pdca skill call missing")
          unexpected = [name for name in tool_names if name != "skill"]
          if unexpected:
              raise SystemExit(f"first turn: unexpected repository/tool access: {unexpected}")
          if not texts:
              raise SystemExit("first turn: no final text")

          final = texts[-1]
          try:
              obj = json.loads(final)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"first turn: final answer must be exactly one JSON object: {exc}: {final!r}")
          if not isinstance(obj, dict):
              raise SystemExit(f"first turn: final JSON value must be an object, got {type(obj).__name__}")
          token = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          if obj != {"continuity_token": token, "state": "waiting_for_followup"}:
              raise SystemExit(f"first turn: unexpected state: {obj!r}")

          sid = next(iter(session_ids))
          pathlib.Path(sys.argv[3]).write_text(sid, encoding="utf-8")
          print(f"first turn session: {sid}")
          PY

          cat >"$RUNNER_TEMP/opencode-continuity-second-prompt.txt" <<'EOF'
          Continue this existing session. Do not read/search files or use repository tools.
          Recover the opaque continuity token from the preceding user message and the prior state.

          Return exactly one JSON object with no extra prose:
          {
            "continuity_token": "<the exact prior token>",
            "prior_state": "waiting_for_followup",
            "state": "continued_original_session"
          }
          EOF

          sid="$(cat "$RUNNER_TEMP/opencode-continuity-session.txt")"
          model="$(cat "$RUNNER_TEMP/opencode-continuity-first.model")"
          set +e
          timeout 180 opencode run             --session "$sid"             --model "$model"             --format json             --             "$(cat "$RUNNER_TEMP/opencode-continuity-second-prompt.txt")"             >"$RUNNER_TEMP/opencode-continuity-second.jsonl"             2>"$RUNNER_TEMP/opencode-continuity-second.stderr"
          status=$?
          set -e
          cat "$RUNNER_TEMP/opencode-continuity-second.stderr"
          [ "$status" -eq 0 ] || exit "$status"

          python3 -             "$RUNNER_TEMP/opencode-continuity-second.jsonl"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-session.txt"             "$RUNNER_TEMP/opencode-continuity-first.model"             "$RUNNER_TEMP/opencode-continuity-summary.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          events = []
          event_path = pathlib.Path(sys.argv[1])
          for line_number, line in enumerate(event_path.read_text(encoding="utf-8").splitlines(), start=1):
              line = line.strip()
              if not line:
                  continue
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{event_path}:{line_number}: invalid OpenCode JSONL event: {exc}")

          expected_sid = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          session_ids = {
              event.get("sessionID")
              for event in events
              if isinstance(event.get("sessionID"), str)
          }
          if session_ids != {expected_sid}:
              raise SystemExit(
                  f"second turn: session changed: expected={expected_sid!r} actual={sorted(session_ids)!r}"
              )

          tool_names = []
          texts = []
          for event in events:
              if event.get("type") == "tool_use":
                  part = event.get("part") or {}
                  tool_names.append(part.get("tool"))
              if event.get("type") == "text":
                  part = event.get("part") or {}
                  value = part.get("text")
                  if isinstance(value, str) and value.strip():
                      texts.append(value.strip())

          unexpected = [name for name in tool_names if name != "skill"]
          if unexpected:
              raise SystemExit(f"second turn: unexpected repository/tool access: {unexpected}")
          if not texts:
              raise SystemExit("second turn: no final text")

          final = texts[-1]
          try:
              obj = json.loads(final)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"second turn: final answer must be exactly one JSON object: {exc}: {final!r}")
          if not isinstance(obj, dict):
              raise SystemExit(f"second turn: final JSON value must be an object, got {type(obj).__name__}")

          token = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = {
              "continuity_token": token,
              "prior_state": "waiting_for_followup",
              "state": "continued_original_session",
          }
          if obj != expected:
              raise SystemExit(f"second turn: previous session state not recovered: {obj!r}")

          summary = {
              "session_id": expected_sid,
              "model": pathlib.Path(sys.argv[4]).read_text(encoding="utf-8").strip(),
              "same_session": True,
              "prior_state_recovered": True,
              "repository_tools_not_used": True,
              "token_sha256": hashlib.sha256(token.encode()).hexdigest(),
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("OpenCode --session continued the original session and recovered prior in-session state")
          PY

      - name: Verify persisted OpenCode session transcript
        if: steps.scope.outputs.run_model_probes == 'true'
        id: session_transcript
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"

          sid="$(cat "$RUNNER_TEMP/opencode-continuity-session.txt")"

          opencode session list --max-count 20 --format json             >"$RUNNER_TEMP/opencode-session-list.json"

          opencode export "$sid"             >"$RUNNER_TEMP/opencode-continuity-export.json"             2>"$RUNNER_TEMP/opencode-continuity-export.stderr"

          cat "$RUNNER_TEMP/opencode-continuity-export.stderr"

          python3 -             "$RUNNER_TEMP/opencode-session-list.json"             "$RUNNER_TEMP/opencode-continuity-export.json"             "$RUNNER_TEMP/opencode-continuity-session.txt"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-transcript-summary.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          session_list = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          exported = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          sid = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          token = pathlib.Path(sys.argv[4]).read_text(encoding="utf-8")

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for child in value.values():
                      yield from strings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from strings(child)

          def contains_exact_string(value, expected):
              return any(item == expected for item in strings(value))

          if not contains_exact_string(session_list, sid):
              raise SystemExit("session list does not contain the continued session id")
          if not contains_exact_string(exported, sid):
              raise SystemExit("export does not contain the continued session id")

          if not isinstance(exported, dict):
              raise SystemExit(f"unexpected export type: {type(exported).__name__}")
          if set(exported) != {"info", "messages"}:
              raise SystemExit(f"unexpected export top-level keys: {sorted(exported)}")

          info = exported["info"]
          messages = exported["messages"]
          if not isinstance(info, dict) or info.get("id") != sid:
              raise SystemExit(f"export info.id mismatch: {info!r}")
          if not isinstance(messages, list):
              raise SystemExit("export messages is not a list")

          role_messages = []
          for message in messages:
              if not isinstance(message, dict):
                  continue
              message_info = message.get("info")
              parts = message.get("parts")
              if not isinstance(message_info, dict) or not isinstance(parts, list):
                  continue
              role = message_info.get("role")
              if role not in {"user", "assistant"}:
                  continue
              text_parts = [
                  part.get("text")
                  for part in parts
                  if isinstance(part, dict)
                  and part.get("type") == "text"
                  and isinstance(part.get("text"), str)
              ]
              role_messages.append((role, "\n".join(text_parts)))

          roles = [role for role, _ in role_messages]
          user_indexes = [
              index for index, (role, _) in enumerate(role_messages)
              if role == "user"
          ]
          if len(user_indexes) != 2:
              raise SystemExit(f"expected exactly two exported user turns, got {user_indexes!r} roles={roles!r}")

          first_user_index, second_user_index = user_indexes
          if first_user_index >= second_user_index:
              raise SystemExit(f"invalid user turn order: {user_indexes!r}")

          first_assistants = [
              text for role, text in role_messages[first_user_index + 1:second_user_index]
              if role == "assistant"
          ]
          second_assistants = [
              text for role, text in role_messages[second_user_index + 1:]
              if role == "assistant"
          ]
          if not first_assistants:
              raise SystemExit(f"no assistant response between user turns: {roles!r}")
          if not second_assistants:
              raise SystemExit(f"no assistant response after second user turn: {roles!r}")

          turn1_user = role_messages[first_user_index][1]
          turn1_assistant = first_assistants[-1]
          turn2_user = role_messages[second_user_index][1]
          turn2_assistant = second_assistants[-1]

          if "synthetic OpenCode session-continuity diagnostic" not in turn1_user:
              raise SystemExit("first exported user turn marker missing")
          if token not in turn1_user:
              raise SystemExit("runtime continuity token missing from first exported user turn")
          if '"state": "waiting_for_followup"' not in turn1_assistant:
              raise SystemExit("first exported assistant state missing")

          if "Continue this existing session." not in turn2_user:
              raise SystemExit("second exported user turn marker missing")
          if token in turn2_user:
              raise SystemExit("runtime token was re-injected into second user turn")
          if '"state": "continued_original_session"' not in turn2_assistant:
              raise SystemExit("second exported assistant continuation state missing")
          if token not in turn2_assistant:
              raise SystemExit("continued assistant did not recover runtime token")

          top_keys = sorted(exported)
          summary = {
              "session_id": sid,
              "session_list_contains_session": True,
              "export_contains_session_id": True,
              "export_top_level_type": type(exported).__name__,
              "export_top_level_keys": top_keys,
              "role_sequence": roles,
              "ordered_two_turn_transcript": True,
              "user_turn_count": 2,
              "assistant_messages_between_turns": len(first_assistants),
              "assistant_messages_after_second_turn": len(second_assistants),
              "first_user_contains_runtime_token": True,
              "second_user_reinjects_runtime_token": False,
              "second_assistant_recovers_runtime_token": True,
              "token_sha256": hashlib.sha256(token.encode()).hexdigest(),
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("OpenCode persisted the continued session as an ordered two-turn user/assistant transcript")
          PY

      - name: Summarize non-gating diagnostic outcomes
        if: always()
        env:
          RUN_MODEL_PROBES: ${{ steps.scope.outputs.run_model_probes }}
          SERVER_SKILL_OUTCOME: ${{ steps.server_skill_discovery.outcome }}
          SERVER_SKILL_CONCLUSION: ${{ steps.server_skill_discovery.conclusion }}
          FRESH_OUTCOME: ${{ steps.fresh_recovery.outcome }}
          FRESH_CONCLUSION: ${{ steps.fresh_recovery.conclusion }}
          CHILD_OUTCOME: ${{ steps.child_context.outcome }}
          CHILD_CONCLUSION: ${{ steps.child_context.conclusion }}
          CONTINUITY_OUTCOME: ${{ steps.session_continuity.outcome }}
          CONTINUITY_CONCLUSION: ${{ steps.session_continuity.conclusion }}
          TRANSCRIPT_OUTCOME: ${{ steps.session_transcript.outcome }}
          TRANSCRIPT_CONCLUSION: ${{ steps.session_transcript.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          rows=(
            "Headless server Skill discovery|$SERVER_SKILL_OUTCOME|$SERVER_SKILL_CONCLUSION"
            "Fresh ontology recovery|$FRESH_OUTCOME|$FRESH_CONCLUSION"
            "Minimum child context|$CHILD_OUTCOME|$CHILD_CONCLUSION"
            "Session continuation|$CONTINUITY_OUTCOME|$CONTINUITY_CONCLUSION"
            "Persisted transcript check|$TRANSCRIPT_OUTCOME|$TRANSCRIPT_CONCLUSION"
          )

          {
            printf '## OpenCode non-gating diagnostics\n\n'
            printf 'Public-model probes requested: %s\n\n' "${RUN_MODEL_PROBES:-unknown}"
            printf '| Probe | Step outcome | Workflow conclusion |\n|---|---|---|\n'
            for row in "${rows[@]}"; do
              IFS='|' read -r name outcome conclusion <<<"$row"
              printf '| %s | %s | %s |\n' "$name" "${outcome:-unknown}" "${conclusion:-unknown}"
            done
            printf '\nSteps marked continue-on-error can report an outcome of failure while the workflow conclusion is success. Inspect the uploaded artifacts to distinguish unavailable model services from probe/parser failures; a successful job alone does not mean these diagnostics passed.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Dump OpenCode diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          export HOME="$TEST_HOME"
          opencode debug paths || true
          opencode debug config || true
          cat "$RUNNER_TEMP/opencode-server.log" || true

      - name: Upload OpenCode smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-compat-smoke
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/opencode-debug-skills.json
            ${{ runner.temp }}/opencode-health.json
            ${{ runner.temp }}/opencode-server-skills.json
            ${{ runner.temp }}/opencode-server.log
            ${{ runner.temp }}/bounded-counter-core-0.9.md
            ${{ runner.temp }}/opencode-fresh-recovery-prompt.txt
            ${{ runner.temp }}/opencode-fresh-run1.jsonl
            ${{ runner.temp }}/opencode-fresh-run1.stderr
            ${{ runner.temp }}/opencode-fresh-run1-attempts.log
            ${{ runner.temp }}/opencode-fresh-run1.model
            ${{ runner.temp }}/opencode-fresh-run2.jsonl
            ${{ runner.temp }}/opencode-fresh-run2.stderr
            ${{ runner.temp }}/opencode-fresh-run2-attempts.log
            ${{ runner.temp }}/opencode-fresh-run2.model
            ${{ runner.temp }}/opencode-fresh-recovery-summary.json
            ${{ runner.temp }}/bounded-counter-label-child-context.md
            ${{ runner.temp }}/opencode-child-context-prompt.txt
            ${{ runner.temp }}/opencode-child-run1.jsonl
            ${{ runner.temp }}/opencode-child-run1.stderr
            ${{ runner.temp }}/opencode-child-run1-attempts.log
            ${{ runner.temp }}/opencode-child-run1.model
            ${{ runner.temp }}/opencode-child-run2.jsonl
            ${{ runner.temp }}/opencode-child-run2.stderr
            ${{ runner.temp }}/opencode-child-run2-attempts.log
            ${{ runner.temp }}/opencode-child-run2.model
            ${{ runner.temp }}/opencode-child-context-summary.json
            ${{ runner.temp }}/opencode-continuity-first.jsonl
            ${{ runner.temp }}/opencode-continuity-first.stderr
            ${{ runner.temp }}/opencode-continuity-first-attempts.log
            ${{ runner.temp }}/opencode-continuity-first.model
            ${{ runner.temp }}/opencode-continuity-session.txt
            ${{ runner.temp }}/opencode-continuity-second.jsonl
            ${{ runner.temp }}/opencode-continuity-second.stderr
            ${{ runner.temp }}/opencode-continuity-summary.json
            ${{ runner.temp }}/opencode-session-list.json
            ${{ runner.temp }}/opencode-continuity-export.json
            ${{ runner.temp }}/opencode-continuity-export.stderr
            ${{ runner.temp }}/opencode-continuity-transcript-summary.json
