name: OpenCode Compatibility Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "INSTALL.md"
      - "skills/**"
      - "ontology/contracts/project-workspace.md"
      - "ontology/contracts/entry-recovery.md"
      - "ontology/concept/capability-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_HOME: ${{ runner.temp }}/pdca-opencode-home
      OPENCODE_VERSION: "1.18.32"
      OPENCODE_SHA256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDCA into isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME"
          sh ./install.sh

          expected=(pdca pdca-assist pdca-plan pdca-do pdca-check pdca-act pdca-model pdca-implement pdca-verify)
          for skill in "${expected[@]}"; do
            test -L "$HOME/.agents/skills/$skill"
            test "$(readlink "$HOME/.agents/skills/$skill")" = "$HOME/.agents/pdca/skills/$skill"
            test -s "$HOME/.agents/skills/$skill/SKILL.md"
          done

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME/.opencode/bin" "$RUNNER_TEMP/opencode-download"
          archive="$RUNNER_TEMP/opencode-download/opencode-linux-x64.tar.gz"
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"

          curl -fL --retry 3 --retry-delay 2 -o "$archive" "$url"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Start OpenCode server
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"
          opencode serve --hostname 127.0.0.1 --port 4096 >"$RUNNER_TEMP/opencode-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/opencode-server.pid"

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4096/api/health >"$RUNNER_TEMP/opencode-health.json"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/opencode-server.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/opencode-health.json"

      - name: Verify OpenCode discovers exactly the nine PDCA runtime skills
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          curl -fsS http://127.0.0.1:4096/api/skill >"$RUNNER_TEMP/opencode-skills.json"
          cat "$RUNNER_TEMP/opencode-skills.json"

          python3 - "$RUNNER_TEMP/opencode-skills.json" <<'PY'
          import json
          import re
          import sys

          expected = {
              "pdca",
              "pdca-assist",
              "pdca-plan",
              "pdca-do",
              "pdca-check",
              "pdca-act",
              "pdca-model",
              "pdca-implement",
              "pdca-verify",
          }

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          strings = set()

          def walk(value):
              if isinstance(value, str):
                  strings.add(value)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      walk(item)

          walk(data)
          discovered = {s for s in strings if re.fullmatch(r"pdca(?:-[a-z]+)*", s)}
          if discovered != expected:
              raise SystemExit(f"PDCA skill discovery mismatch: expected={sorted(expected)} discovered={sorted(discovered)}")
          print("discovered PDCA skills:", ", ".join(sorted(discovered)))
          PY

      - name: Activate pdca skill in a session without provider execution
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"

          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          import urllib.request

          root = sys.argv[1]
          tmp = sys.argv[2]
          base = "http://127.0.0.1:4096"

          def request(path, method="GET", body=None):
              payload = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  base + path,
                  data=payload,
                  method=method,
                  headers={"Content-Type": "application/json"} if payload is not None else {},
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          status, created = request("/api/session", "POST", {"location": {"directory": root}})
          if status != 200:
              raise SystemExit(f"session create status={status}")

          def find_session_id(value):
              if isinstance(value, str) and value.startswith("ses_"):
                  return value
              if isinstance(value, list):
                  for item in value:
                      found = find_session_id(item)
                      if found:
                          return found
              if isinstance(value, dict):
                  for item in value.values():
                      found = find_session_id(item)
                      if found:
                          return found
              return None

          sid = find_session_id(created)
          if not sid:
              raise SystemExit(f"could not locate session id in response: {created!r}")

          status, _ = request(f"/api/session/{sid}/skill", "POST", {"skill": "pdca", "resume": False})
          if status != 204:
              raise SystemExit(f"skill activation status={status}")

          status, messages = request(f"/api/session/{sid}/message")
          if status != 200:
              raise SystemExit(f"message list status={status}")

          def find_pdca_skill(value):
              if isinstance(value, dict):
                  if value.get("type") == "skill" and value.get("skill") == "pdca":
                      text = value.get("text", "")
                      if "PDCA：定位、绑定与运行入口分流" not in text:
                          raise SystemExit("pdca skill message present but body marker missing")
                      return True
                  return any(find_pdca_skill(v) for v in value.values())
              if isinstance(value, list):
                  return any(find_pdca_skill(v) for v in value)
              return False

          if not find_pdca_skill(messages):
              raise SystemExit("activated pdca skill message not found")

          with open(tmp + "/opencode-session-create.json", "w", encoding="utf-8") as fp:
              json.dump(created, fp, ensure_ascii=False, indent=2)
          with open(tmp + "/opencode-session-messages.json", "w", encoding="utf-8") as fp:
              json.dump(messages, fp, ensure_ascii=False, indent=2)

          print("session:", sid)
          print("pdca skill activation: verified")
          PY

      - name: Report provider boundary
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"

          present=()
          for name in OPENCODE_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY GEMINI_API_KEY; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "No provider credential is present in this job."
            echo "Model execution, native fresh-Agent reasoning, H11 and H18 remain intentionally unexecuted."
          else
            echo "Provider credential presence detected (names only): ${present[*]}"
            echo "This smoke does not consume repository secrets automatically."
          fi

      - name: Dump OpenCode diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          export HOME="$TEST_HOME"
          opencode debug paths || true
          opencode debug config || true
          cat "$RUNNER_TEMP/opencode-server.log" || true

      - name: Upload OpenCode smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-compat-smoke
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/opencode-health.json
            ${{ runner.temp }}/opencode-skills.json
            ${{ runner.temp }}/opencode-session-create.json
            ${{ runner.temp }}/opencode-session-messages.json
            ${{ runner.temp }}/opencode-server.log
