            "unknowns": ["U-OPERATION-RETURN-CONTRACT", "U-LABEL-READ-MAPPING", "U-LABEL-REJECTION-OBSERVABILITY"],
            "constraints": ["C-LABEL", "C-LABEL-INPUT"],
            "requirements": ["REQ-LABEL-001", "REQ-COMP-001", "REQ-MODEL-SHAPE-001"],
            "root_scope_boundary": {
