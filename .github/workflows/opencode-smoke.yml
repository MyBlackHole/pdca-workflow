name: OpenCode Compatibility Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "skills/**"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "skills/**"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_HOME: /tmp/pdca-opencode-home
      OPENCODE_TEST_HOME: /tmp/pdca-opencode-home
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "false"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "false"
      OPENCODE_VERSION: "1.18.32"
      OPENCODE_SHA256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify public-model probe scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$CURRENT_SHA"
              ;;
            *)
              echo "run_model_probes=true" >>"$GITHUB_OUTPUT"
              echo "No reliable comparison range for $EVENT_NAME; running all public-model probes."
              exit 0
              ;;
          esac

          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "run_model_probes=true" >>"$GITHUB_OUTPUT"
              echo "Missing comparison base; running all public-model probes."
              exit 0
              ;;
          esac

          changes="$(git diff --name-only "$base" "$head")"
          printf 'Changed files:\n%s\n' "$changes"

          run_model_probes=false
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/opencode-smoke.yml|skills/*|ontology/projects/pdca-host-smoke/works/bounded-counter/*)
                run_model_probes=true
                break
                ;;
            esac
          done <<EOF
          $changes
          EOF

          echo "run_model_probes=$run_model_probes" >>"$GITHUB_OUTPUT"
          echo "Public-model probes: $run_model_probes"

      - name: Install PDCA into isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME"
          sh ./install.sh

          mapfile -t expected < <(
            python3 - <<'PY'
          import json

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          for entry in catalog.get("skills", []):
              name = entry.get("name")
              if not isinstance(name, str) or not name:
                  raise SystemExit(f"invalid catalog Skill name: {name!r}")
              print(name)
          PY
          )
          [ "${#expected[@]}" -gt 0 ] || {
            echo "Runtime Skill catalog is empty." >&2
            exit 1
          }

          for skill in "${expected[@]}"; do
            test -L "$HOME/.agents/skills/$skill"
            test "$(readlink "$HOME/.agents/skills/$skill")" = "$HOME/.agents/pdca/skills/$skill"
            test -s "$HOME/.agents/skills/$skill/SKILL.md"
          done

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME/.opencode/bin" "$RUNNER_TEMP/opencode-download"
          archive="$RUNNER_TEMP/opencode-download/opencode-linux-x64.tar.gz"
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"

          curl -fL --retry 3 --retry-delay 2 -o "$archive" "$url"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Report OpenCode external-skill flags
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENCODE_DISABLE_EXTERNAL_SKILLS OPENCODE_DISABLE_CLAUDE_CODE_SKILLS OPENCODE_DISABLE_CLAUDE_CODE OPENCODE_PURE; do
            printf '%s=%s\n' "$name" "${!name-<unset>}"
          done

      - name: Verify OpenCode CLI discovers and parses PDCA skills
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"

          opencode debug skill >"$RUNNER_TEMP/opencode-debug-skills.json"
          cat "$RUNNER_TEMP/opencode-debug-skills.json"

          python3 - "$RUNNER_TEMP/opencode-debug-skills.json" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          expected = {
              entry.get("name")
              for entry in catalog.get("skills", [])
              if isinstance(entry, dict) and isinstance(entry.get("name"), str)
          }
          if not expected:
              raise SystemExit("runtime Skill catalog is empty")

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit(f"unexpected debug skill shape: {type(data).__name__}")

          by_name = {
              item.get("name"): item
              for item in data
              if isinstance(item, dict) and isinstance(item.get("name"), str)
          }
          discovered = set(by_name) & expected
          unexpected_pdca = {
              name
              for name in by_name
              if (name == "pdca" or name.startswith("pdca-")) and name not in expected
          }
          if discovered != expected or unexpected_pdca:
              raise SystemExit(
                  "OpenCode CLI PDCA discovery mismatch: "
                  f"expected={sorted(expected)} discovered={sorted(discovered)} "
                  f"unexpected_pdca={sorted(unexpected_pdca)}"
              )

          for name in sorted(expected):
              item = by_name[name]
              description = item.get("description")
              location = item.get("location", "")
              if not isinstance(description, str) or not description.strip():
                  raise SystemExit(f"{name}: description missing")
              if f"/.agents/skills/{name}/SKILL.md" not in location:
                  raise SystemExit(f"{name}: unexpected location {location!r}")

          pdca = by_name["pdca"]
          if "PDCA：定位、绑定与运行入口分流" not in pdca.get("content", ""):
              raise SystemExit("pdca Skill body marker missing")

          print(f"OpenCode CLI discovered and parsed all {len(expected)} catalogued PDCA runtime skills.")
          PY

      - name: Start OpenCode server for non-gating diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"
          opencode serve --hostname 127.0.0.1 --port 4096 >"$RUNNER_TEMP/opencode-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/opencode-server.pid"

          healthy=0
          for _ in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/api/health >"$RUNNER_TEMP/opencode-health.json"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/opencode-server.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/opencode-health.json"

      - name: Collect headless server skill-discovery diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          curl -fsS \
            -H "x-opencode-directory: $GITHUB_WORKSPACE" \
            http://127.0.0.1:4096/api/skill \
            >"$RUNNER_TEMP/opencode-server-skills.json"
          cat "$RUNNER_TEMP/opencode-server-skills.json"

          python3 - "$RUNNER_TEMP/opencode-server-skills.json" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          expected = {
              entry.get("name")
              for entry in catalog.get("skills", [])
              if isinstance(entry, dict) and isinstance(entry.get("name"), str)
          }
          if not expected:
              raise SystemExit("runtime Skill catalog is empty")

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {item.get("name") for item in data.get("data", []) if isinstance(item, dict)}
          discovered = sorted(names & expected)
          print("headless server PDCA skills:", discovered)
          if set(discovered) != expected:
              raise SystemExit(
                  "Headless server instance did not expose all external PDCA skills; "
                  "this is diagnostic only. CLI compatibility is gated by opencode debug skill."
              )
          PY
      - name: Report provider boundary
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"

          present=()
          for name in OPENCODE_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY GEMINI_API_KEY; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "No provider credential is present in this job."
            echo "No credential-backed model execution is available; a public free-model diagnostic runs next."
          else
            echo "Provider credential presence detected (names only): ${present[*]}"
            echo "This smoke does not consume repository secrets automatically."
          fi

      - name: Probe two fresh public-model sessions from ontology core only
        if: steps.scope.outputs.run_model_probes == 'true'
        id: fresh_recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          unset OPENCODE_DISABLE_MODELS_FETCH
          cd "$GITHUB_WORKSPACE"

          python3 - \
            ontology/projects/pdca-host-smoke/works/bounded-counter/candidate-0.3.0/model.md \
            "$RUNNER_TEMP/bounded-counter-core-0.3.md" <<'PY'
          import pathlib
          import re
          import sys

          src = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "## 8. Derived work projection candidates"
          if marker not in src:
              raise SystemExit("bounded-counter projection marker missing")
          core = src.split(marker, 1)[0]
          leaks = sorted(set(re.findall(r"\bNODE-[A-Z0-9-]+\b", core)))
          if leaks:
              raise SystemExit(f"derived NODE identity leaked into ontology core: {leaks}")
          pathlib.Path(sys.argv[2]).write_text(core, encoding="utf-8")
          print("ontology-core NODE identity leaks: 0")
          PY

          cat >"$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt" <<'EOF'
          This is a synthetic compatibility test with no private data.
          First use the OpenCode skill tool to load the skill named `pdca`.
          Do not modify files. Do not invent or assume any precomputed work-node identity.
          Use only the attached bounded-counter ontology core and traceability as domain evidence.

          Reconstruct the semantic work projection:
          - the unique composition root and component instances;
          - the producer/consumer dependency candidate and interface;
          - whether that dependency is ready;
          - one concise responsibility statement for each work instance.

          Output exactly one JSON object with this shape and no extra prose:
          {
            "tree": {"root": "INST-SYSTEM", "children": ["INST-COUNTER", "INST-LABEL"]},
            "dependency": {
              "producer": "INST-COUNTER",
              "consumer": "INST-LABEL",
              "interface": "legal_count_value",
              "ready": false
            },
            "responsibilities": {
              "INST-SYSTEM": "...",
              "INST-COUNTER": "...",
              "INST-LABEL": "..."
            },
            "limitations": ["..."]
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          run_one() {
            run="$1"
            success=0
            : >"$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            for model in "${models[@]}"; do
              echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              set +e
              timeout 180 opencode run \
                --model "$model" \
                --format json \
                --file "$RUNNER_TEMP/bounded-counter-core-0.3.md" \
                -- \
                "$(cat "$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt")" \
                >"$RUNNER_TEMP/opencode-fresh-$run.jsonl" \
                2>"$RUNNER_TEMP/opencode-fresh-$run.stderr"
              status=$?
              set -e
              cat "$RUNNER_TEMP/opencode-fresh-$run.stderr" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              if [ "$status" -eq 0 ]; then
                echo "$model" >"$RUNNER_TEMP/opencode-fresh-$run.model"
                echo "selected_model=$model" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
                success=1
                break
              fi
              echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            done
            if [ "$success" -ne 1 ]; then
              echo "No public free model completed fresh run $run."
              return 1
            fi
          }

          run_one run1
          run_one run2

          python3 - \
            "$RUNNER_TEMP/opencode-fresh-run1.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run2.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run1.model" \
            "$RUNNER_TEMP/opencode-fresh-run2.model" \
            "$RUNNER_TEMP/opencode-fresh-recovery-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          expected_children = {"INST-COUNTER", "INST-LABEL"}
          expected_instances = {"INST-SYSTEM", "INST-COUNTER", "INST-LABEL"}

          def load_run(path):
              events = []
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

              skill_parts = []
              texts = []
              session_ids = set()
              for event in events:
                  sid = event.get("sessionID")
                  if isinstance(sid, str):
                      session_ids.add(sid)
                  if event.get("type") == "tool_use":
                      part = event.get("part") or {}
                      if part.get("tool") == "skill":
                          skill_parts.append(part)
                  if event.get("type") == "text":
                      part = event.get("part") or {}
                      value = part.get("text")
                      if isinstance(value, str) and value.strip():
                          texts.append(value.strip())

              if not skill_parts:
                  raise SystemExit(f"{path}: model did not call the skill tool")
              if not any("pdca" in json.dumps(part, ensure_ascii=False).lower() for part in skill_parts):
                  raise SystemExit(f"{path}: skill tool call did not reference pdca")
              if len(session_ids) != 1:
                  raise SystemExit(f"{path}: expected exactly one session id, got {sorted(session_ids)}")
              if not texts:
                  raise SystemExit(f"{path}: no final text event")

              final = texts[-1]
              left = final.find("{")
              right = final.rfind("}")
              if left < 0 or right <= left:
                  raise SystemExit(f"{path}: final answer does not contain a JSON object: {final!r}")
              try:
                  obj = json.loads(final[left:right + 1])
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{path}: invalid final JSON: {exc}: {final!r}")

              if set(obj) != {"tree", "dependency", "responsibilities", "limitations"}:
                  raise SystemExit(f"{path}: unexpected top-level keys: {sorted(obj)}")

              tree = obj["tree"]
              if tree.get("root") != "INST-SYSTEM":
                  raise SystemExit(f"{path}: wrong tree root: {tree!r}")
              if set(tree.get("children") or []) != expected_children:
                  raise SystemExit(f"{path}: wrong tree children: {tree!r}")

              dep = obj["dependency"]
              expected_dep = {
                  "producer": "INST-COUNTER",
                  "consumer": "INST-LABEL",
                  "interface": "legal_count_value",
                  "ready": False,
              }
              for key, value in expected_dep.items():
                  if dep.get(key) != value:
                      raise SystemExit(f"{path}: dependency {key} mismatch: {dep!r}")

              responsibilities = obj["responsibilities"]
              if set(responsibilities) != expected_instances:
                  raise SystemExit(f"{path}: responsibility instances mismatch: {sorted(responsibilities)}")
              if not all(isinstance(v, str) and v.strip() for v in responsibilities.values()):
                  raise SystemExit(f"{path}: empty responsibility text")

              limitations = obj["limitations"]
              if not isinstance(limitations, list) or not limitations:
                  raise SystemExit(f"{path}: limitations must be a nonempty list")

              normalized = {
                  "tree": {
                      "root": tree["root"],
                      "children": sorted(tree["children"]),
                  },
                  "dependency": expected_dep,
                  "responsibility_instances": sorted(responsibilities),
              }
              return next(iter(session_ids)), normalized, obj

          sid1, norm1, raw1 = load_run(sys.argv[1])
          sid2, norm2, raw2 = load_run(sys.argv[2])
          if sid1 == sid2:
              raise SystemExit(f"fresh runs reused the same session id: {sid1}")
          if norm1 != norm2:
              raise SystemExit(f"fresh-session normalized semantics differ: run1={norm1!r} run2={norm2!r}")

          summary = {
              "run1": {
                  "session_id": sid1,
                  "model": pathlib.Path(sys.argv[3]).read_text().strip(),
                  "answer": raw1,
              },
              "run2": {
                  "session_id": sid2,
                  "model": pathlib.Path(sys.argv[4]).read_text().strip(),
                  "answer": raw2,
              },
              "normalized_semantics": norm1,
              "same_semantics": True,
              "different_sessions": True,
          }
          pathlib.Path(sys.argv[5]).write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("two fresh OpenCode sessions recovered equivalent bounded-counter semantics")
          PY

      - name: Probe minimum label-child context in two fresh public-model sessions
        if: steps.scope.outputs.run_model_probes == 'true'
        id: child_context
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          unset OPENCODE_DISABLE_MODELS_FETCH
          cd "$GITHUB_WORKSPACE"

          cat >"$RUNNER_TEMP/bounded-counter-label-child-context.md" <<'EOF'
          # Synthetic pre-H18 label-child minimum context

          This file is a test-only CONTEXT-01 selection derived from bounded-counter candidate-0.3.0.
          It is not a fixed assignment record and does not make the candidate a formal node.

          ## Current candidate node

          - node identity: NODE-LABEL
          - ontology/work ref: INST-LABEL
          - responsibility: format a legal count reading
          - input: legal_count_value
          - output: exact label text
          - constraints: C-LABEL, C-LABEL-INPUT
          - parent composition: REL-COMP-SYSTEM-LABEL
          - dependency: REL-CONSUMES-LEGAL-READING
          - acceptance:
            - legal inputs 0,1,2 map exactly to count=0,count=1,count=2
            - consumed input is constrained by C-LABEL-INPUT and originates from legal_count_value
          - oracle: reject if a legal input is formatted differently or an out-of-domain value can reach the formatter

          ## Definition and work instance

          DEF-LABEL:
          - semantic kind: stateless component
          - responsibility: map a legal count value N to the exact text count=N
          - input: legal count value
          - output: label text

          INST-LABEL:
          - instance_of: DEF-LABEL

          ## Parent boundary

          INST-SYSTEM:
          - role in this context: direct aggregate parent identity only

          REL-COMP-SYSTEM-LABEL:
          - source: INST-SYSTEM
          - target: INST-LABEL
          - shared interface: system supplies a legal count value and receives exact label text
          - shared invariant: label behavior satisfies C-LABEL and C-LABEL-INPUT
          - parent composition responsibility: aggregate guarantees that legal counter readings can be represented as labels

          ## Required dependency endpoint

          INST-COUNTER:
          - role in this context: producer endpoint identity only
          - internal counter implementation/operation semantics are intentionally not included

          REL-CONSUMES-LEGAL-READING:
          - source: INST-COUNTER
          - target: INST-LABEL
          - producer/consumer direction: INST-COUNTER -> INST-LABEL
          - interface: legal_count_value
          - interface contract: integer N where 0 <= N <= 2
          - consumer interpretation: label responsibility depends on this producer/interface
          - fixed deliverable version/digest: not_fixed
          - ready evidence: none
          - ready: false

          ## Constraints

          C-LABEL:
          - subject: INST-LABEL
          - predicate: for legal N, output is exactly count=N
          - applicability: N in [0,2]
          - requirement: REQ-LABEL-001

          C-LABEL-INPUT:
          - subject: REL-CONSUMES-LEGAL-READING
          - predicate: formatter input N satisfies 0 <= N <= 2 and originates from legal_count_value
          - requirement: REQ-COMP-001

          ## Requirements

          REQ-LABEL-001:
          - legal counter reading N is represented as count=N

          REQ-COMP-001:
          - label formatting consumes only a legal counter reading

          ## Explicitly excluded from this initial context

          - DEF-COUNTER full definition
          - counter increment semantics and C-INC
          - counter reset semantics and C-RESET
          - counter initialization/read implementation details C-INIT/C-READ
          - NODE-COUNTER full work-node contract
          - sibling task conversation/history
          - parent Plan/Do/Check/Act activity history
          - unrelated ontology branches
          - implementation artifacts
          - behavior evidence

          The child may report these excluded facts as unavailable/not_in_context, but must not invent them.
          EOF

          cat >"$RUNNER_TEMP/opencode-child-context-prompt.txt" <<'EOF'
          This is a synthetic compatibility test with no private data.
          First use the OpenCode skill tool to load the skill named pdca.
          Do not modify files.
          Treat the attached file as the complete initial context for this child.
          Do not fill excluded facts from general knowledge or assumptions.

          Return exactly one JSON object with no extra prose:
          {
            "current_node": "NODE-LABEL",
            "work_instance": "INST-LABEL",
            "responsibility": "...",
            "input_interface": "legal_count_value",
            "producer_endpoint": "INST-COUNTER",
            "constraints": ["C-LABEL", "C-LABEL-INPUT"],
            "requirements": ["REQ-LABEL-001", "REQ-COMP-001"],
            "dependency_ready": false,
            "excluded": {
              "counter_increment_semantics": "not_in_context",
              "counter_reset_semantics": "not_in_context",
              "parent_activity_history": "not_in_context",
              "sibling_full_context": "not_in_context"
            },
            "limitations": ["..."]
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          run_one() {
            run="$1"
            success=0
            : >"$RUNNER_TEMP/opencode-child-$run-attempts.log"
            for model in "${models[@]}"; do
              echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-child-$run-attempts.log"
              set +e
              timeout 180 opencode run \
                --model "$model" \
                --format json \
                --file "$RUNNER_TEMP/bounded-counter-label-child-context.md" \
                -- \
                "$(cat "$RUNNER_TEMP/opencode-child-context-prompt.txt")" \
                >"$RUNNER_TEMP/opencode-child-$run.jsonl" \
                2>"$RUNNER_TEMP/opencode-child-$run.stderr"
              status=$?
              set -e
              cat "$RUNNER_TEMP/opencode-child-$run.stderr" | tee -a "$RUNNER_TEMP/opencode-child-$run-attempts.log"
              if [ "$status" -eq 0 ]; then
                echo "$model" >"$RUNNER_TEMP/opencode-child-$run.model"
                success=1
                break
              fi
              echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-child-$run-attempts.log"
            done
            [ "$success" -eq 1 ] || return 1
          }

          run_one run1
          run_one run2

          python3 - \
            "$RUNNER_TEMP/opencode-child-run1.jsonl" \
            "$RUNNER_TEMP/opencode-child-run2.jsonl" \
            "$RUNNER_TEMP/opencode-child-run1.model" \
            "$RUNNER_TEMP/opencode-child-run2.model" \
            "$RUNNER_TEMP/opencode-child-context-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          expected_constraints = {"C-LABEL", "C-LABEL-INPUT"}
          expected_requirements = {"REQ-LABEL-001", "REQ-COMP-001"}
          excluded_expected = {
              "counter_increment_semantics": "not_in_context",
              "counter_reset_semantics": "not_in_context",
              "parent_activity_history": "not_in_context",
              "sibling_full_context": "not_in_context",
          }

          def load_run(path):
              events = []
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

              skill_parts = []
              tool_names = []
              texts = []
              session_ids = set()
              for event in events:
                  sid = event.get("sessionID")
                  if isinstance(sid, str):
                      session_ids.add(sid)
                  if event.get("type") == "tool_use":
                      part = event.get("part") or {}
                      tool = part.get("tool")
                      tool_names.append(tool)
                      if tool == "skill":
                          skill_parts.append(part)
                  if event.get("type") == "text":
                      part = event.get("part") or {}
                      value = part.get("text")
                      if isinstance(value, str) and value.strip():
                          texts.append(value.strip())

              if not skill_parts or not any("pdca" in json.dumps(p, ensure_ascii=False).lower() for p in skill_parts):
                  raise SystemExit(f"{path}: pdca skill tool call missing")
              unexpected_tools = [tool for tool in tool_names if tool != "skill"]
              if unexpected_tools:
                  raise SystemExit(f"{path}: unexpected tool access outside supplied context: {unexpected_tools}")
              if tool_names.count("skill") != 1:
                  raise SystemExit(f"{path}: expected exactly one skill tool call, got {tool_names}")
              if len(session_ids) != 1:
                  raise SystemExit(f"{path}: expected one session id, got {sorted(session_ids)}")
              if not texts:
                  raise SystemExit(f"{path}: no final text")

              final = texts[-1]
              left, right = final.find("{"), final.rfind("}")
              if left < 0 or right <= left:
                  raise SystemExit(f"{path}: JSON object missing: {final!r}")
              obj = json.loads(final[left:right + 1])

              expected_keys = {
                  "current_node", "work_instance", "responsibility", "input_interface",
                  "producer_endpoint", "constraints", "requirements", "dependency_ready",
                  "excluded", "limitations",
              }
              if set(obj) != expected_keys:
                  raise SystemExit(f"{path}: unexpected keys: {sorted(obj)}")
              if obj["current_node"] != "NODE-LABEL" or obj["work_instance"] != "INST-LABEL":
                  raise SystemExit(f"{path}: wrong current-node identity: {obj!r}")
              if obj["input_interface"] != "legal_count_value" or obj["producer_endpoint"] != "INST-COUNTER":
                  raise SystemExit(f"{path}: wrong dependency endpoint/interface: {obj!r}")
              if set(obj["constraints"]) != expected_constraints:
                  raise SystemExit(f"{path}: wrong constraints: {obj['constraints']!r}")
              if set(obj["requirements"]) != expected_requirements:
                  raise SystemExit(f"{path}: wrong requirements: {obj['requirements']!r}")
              if obj["dependency_ready"] is not False:
                  raise SystemExit(f"{path}: dependency must remain not ready")
              if obj["excluded"] != excluded_expected:
                  raise SystemExit(f"{path}: excluded-context contract violated: {obj['excluded']!r}")
              if not isinstance(obj["responsibility"], str) or not obj["responsibility"].strip():
                  raise SystemExit(f"{path}: responsibility missing")
              if not isinstance(obj["limitations"], list) or not obj["limitations"]:
                  raise SystemExit(f"{path}: limitations missing")

              normalized = {
                  "current_node": obj["current_node"],
                  "work_instance": obj["work_instance"],
                  "input_interface": obj["input_interface"],
                  "producer_endpoint": obj["producer_endpoint"],
                  "constraints": sorted(obj["constraints"]),
                  "requirements": sorted(obj["requirements"]),
                  "dependency_ready": obj["dependency_ready"],
                  "excluded": obj["excluded"],
              }
              return next(iter(session_ids)), normalized, obj

          sid1, norm1, raw1 = load_run(sys.argv[1])
          sid2, norm2, raw2 = load_run(sys.argv[2])
          if sid1 == sid2:
              raise SystemExit(f"child-context runs reused session id {sid1}")
          if norm1 != norm2:
              raise SystemExit(f"child-context normalized semantics differ: {norm1!r} != {norm2!r}")

          summary = {
              "run1": {
                  "session_id": sid1,
                  "model": pathlib.Path(sys.argv[3]).read_text().strip(),
                  "answer": raw1,
              },
              "run2": {
                  "session_id": sid2,
                  "model": pathlib.Path(sys.argv[4]).read_text().strip(),
                  "answer": raw2,
              },
              "normalized_context_semantics": norm1,
              "same_semantics": True,
              "different_sessions": True,
              "excluded_context_respected": True,
              "tool_boundary_respected": True,
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("two fresh OpenCode sessions respected the same minimum label-child context")
          PY

      - name: Probe explicit OpenCode session continuation
        if: steps.scope.outputs.run_model_probes == 'true'
        id: session_continuity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          unset OPENCODE_DISABLE_MODELS_FETCH
          cd "$GITHUB_WORKSPACE"

          python3 - "$RUNNER_TEMP/opencode-continuity-token.txt" <<'PY'
          import pathlib
          import secrets
          import sys

          token = "pdca-continuity-" + secrets.token_hex(16)
          pathlib.Path(sys.argv[1]).write_text(token, encoding="utf-8")
          PY

          token="$(cat "$RUNNER_TEMP/opencode-continuity-token.txt")"
          cat >"$RUNNER_TEMP/opencode-continuity-first-prompt.txt" <<EOF
          This is a synthetic OpenCode session-continuity diagnostic with no private data.
          First use the OpenCode skill tool to load the skill named pdca.
          Do not modify files and do not read/search the repository.
          Remember this opaque runtime token for the next message in this same session:

          $token

          Return exactly one JSON object with no extra prose:
          {
            "continuity_token": "$token",
            "state": "waiting_for_followup"
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          success=0
          : >"$RUNNER_TEMP/opencode-continuity-first-attempts.log"
          for model in "${models[@]}"; do
            echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
            set +e
            timeout 180 opencode run               --model "$model"               --format json               --               "$(cat "$RUNNER_TEMP/opencode-continuity-first-prompt.txt")"               >"$RUNNER_TEMP/opencode-continuity-first.jsonl"               2>"$RUNNER_TEMP/opencode-continuity-first.stderr"
            status=$?
            set -e
            cat "$RUNNER_TEMP/opencode-continuity-first.stderr" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
            if [ "$status" -eq 0 ]; then
              echo "$model" >"$RUNNER_TEMP/opencode-continuity-first.model"
              success=1
              break
            fi
            echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-continuity-first-attempts.log"
          done
          [ "$success" -eq 1 ] || {
            echo "No public free model completed the first continuity turn."
            exit 1
          }

          python3 -             "$RUNNER_TEMP/opencode-continuity-first.jsonl"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-session.txt" <<'PY'
          import json
          import pathlib
          import sys

          events = []
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  continue

          session_ids = {
              event.get("sessionID")
              for event in events
              if isinstance(event.get("sessionID"), str)
          }
          tool_names = []
          skill_parts = []
          texts = []
          for event in events:
              if event.get("type") == "tool_use":
                  part = event.get("part") or {}
                  tool = part.get("tool")
                  tool_names.append(tool)
                  if tool == "skill":
                      skill_parts.append(part)
              if event.get("type") == "text":
                  part = event.get("part") or {}
                  value = part.get("text")
                  if isinstance(value, str) and value.strip():
                      texts.append(value.strip())

          if len(session_ids) != 1:
              raise SystemExit(f"first turn: expected one session id, got {sorted(session_ids)}")
          if not skill_parts or not any(
              "pdca" in json.dumps(part, ensure_ascii=False).lower()
              for part in skill_parts
          ):
              raise SystemExit("first turn: pdca skill call missing")
          unexpected = [name for name in tool_names if name != "skill"]
          if unexpected:
              raise SystemExit(f"first turn: unexpected repository/tool access: {unexpected}")
          if not texts:
              raise SystemExit("first turn: no final text")

          final = texts[-1]
          left, right = final.find("{"), final.rfind("}")
          if left < 0 or right <= left:
              raise SystemExit(f"first turn: JSON object missing: {final!r}")
          obj = json.loads(final[left:right + 1])
          token = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          if obj != {"continuity_token": token, "state": "waiting_for_followup"}:
              raise SystemExit(f"first turn: unexpected state: {obj!r}")

          sid = next(iter(session_ids))
          pathlib.Path(sys.argv[3]).write_text(sid, encoding="utf-8")
          print(f"first turn session: {sid}")
          PY

          cat >"$RUNNER_TEMP/opencode-continuity-second-prompt.txt" <<'EOF'
          Continue this existing session. Do not read/search files or use repository tools.
          Recover the opaque continuity token from the preceding user message and the prior state.

          Return exactly one JSON object with no extra prose:
          {
            "continuity_token": "<the exact prior token>",
            "prior_state": "waiting_for_followup",
            "state": "continued_original_session"
          }
          EOF

          sid="$(cat "$RUNNER_TEMP/opencode-continuity-session.txt")"
          model="$(cat "$RUNNER_TEMP/opencode-continuity-first.model")"
          set +e
          timeout 180 opencode run             --session "$sid"             --model "$model"             --format json             --             "$(cat "$RUNNER_TEMP/opencode-continuity-second-prompt.txt")"             >"$RUNNER_TEMP/opencode-continuity-second.jsonl"             2>"$RUNNER_TEMP/opencode-continuity-second.stderr"
          status=$?
          set -e
          cat "$RUNNER_TEMP/opencode-continuity-second.stderr"
          [ "$status" -eq 0 ] || exit "$status"

          python3 -             "$RUNNER_TEMP/opencode-continuity-second.jsonl"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-session.txt"             "$RUNNER_TEMP/opencode-continuity-first.model"             "$RUNNER_TEMP/opencode-continuity-summary.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          events = []
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  continue

          expected_sid = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          session_ids = {
              event.get("sessionID")
              for event in events
              if isinstance(event.get("sessionID"), str)
          }
          if session_ids != {expected_sid}:
              raise SystemExit(
                  f"second turn: session changed: expected={expected_sid!r} actual={sorted(session_ids)!r}"
              )

          tool_names = []
          texts = []
          for event in events:
              if event.get("type") == "tool_use":
                  part = event.get("part") or {}
                  tool_names.append(part.get("tool"))
              if event.get("type") == "text":
                  part = event.get("part") or {}
                  value = part.get("text")
                  if isinstance(value, str) and value.strip():
                      texts.append(value.strip())

          unexpected = [name for name in tool_names if name != "skill"]
          if unexpected:
              raise SystemExit(f"second turn: unexpected repository/tool access: {unexpected}")
          if not texts:
              raise SystemExit("second turn: no final text")

          final = texts[-1]
          left, right = final.find("{"), final.rfind("}")
          if left < 0 or right <= left:
              raise SystemExit(f"second turn: JSON object missing: {final!r}")
          obj = json.loads(final[left:right + 1])

          token = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = {
              "continuity_token": token,
              "prior_state": "waiting_for_followup",
              "state": "continued_original_session",
          }
          if obj != expected:
              raise SystemExit(f"second turn: previous session state not recovered: {obj!r}")

          summary = {
              "session_id": expected_sid,
              "model": pathlib.Path(sys.argv[4]).read_text(encoding="utf-8").strip(),
              "same_session": True,
              "prior_state_recovered": True,
              "repository_tools_not_used": True,
              "token_sha256": hashlib.sha256(token.encode()).hexdigest(),
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("OpenCode --session continued the original session and recovered prior in-session state")
          PY

      - name: Verify persisted OpenCode session transcript
        if: steps.scope.outputs.run_model_probes == 'true'
        id: session_transcript
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"

          sid="$(cat "$RUNNER_TEMP/opencode-continuity-session.txt")"
          token="$(cat "$RUNNER_TEMP/opencode-continuity-token.txt")"

          opencode session list --max-count 20 --format json             >"$RUNNER_TEMP/opencode-session-list.json"

          opencode export "$sid"             >"$RUNNER_TEMP/opencode-continuity-export.json"             2>"$RUNNER_TEMP/opencode-continuity-export.stderr"

          cat "$RUNNER_TEMP/opencode-continuity-export.stderr"

          python3 -             "$RUNNER_TEMP/opencode-session-list.json"             "$RUNNER_TEMP/opencode-continuity-export.json"             "$RUNNER_TEMP/opencode-continuity-session.txt"             "$RUNNER_TEMP/opencode-continuity-token.txt"             "$RUNNER_TEMP/opencode-continuity-transcript-summary.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          session_list = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          exported = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          sid = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          token = pathlib.Path(sys.argv[4]).read_text(encoding="utf-8")

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for child in value.values():
                      yield from strings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from strings(child)

          def contains_exact_string(value, expected):
              return any(item == expected for item in strings(value))

          if not contains_exact_string(session_list, sid):
              raise SystemExit("session list does not contain the continued session id")
          if not contains_exact_string(exported, sid):
              raise SystemExit("export does not contain the continued session id")

          if not isinstance(exported, dict):
              raise SystemExit(f"unexpected export type: {type(exported).__name__}")
          if set(exported) != {"info", "messages"}:
              raise SystemExit(f"unexpected export top-level keys: {sorted(exported)}")

          info = exported["info"]
          messages = exported["messages"]
          if not isinstance(info, dict) or info.get("id") != sid:
              raise SystemExit(f"export info.id mismatch: {info!r}")
          if not isinstance(messages, list):
              raise SystemExit("export messages is not a list")

          role_messages = []
          for message in messages:
              if not isinstance(message, dict):
                  continue
              message_info = message.get("info")
              parts = message.get("parts")
              if not isinstance(message_info, dict) or not isinstance(parts, list):
                  continue
              role = message_info.get("role")
              if role not in {"user", "assistant"}:
                  continue
              text_parts = [
                  part.get("text")
                  for part in parts
                  if isinstance(part, dict)
                  and part.get("type") == "text"
                  and isinstance(part.get("text"), str)
              ]
              role_messages.append((role, "\n".join(text_parts)))

          roles = [role for role, _ in role_messages]
          user_indexes = [
              index for index, (role, _) in enumerate(role_messages)
              if role == "user"
          ]
          if len(user_indexes) != 2:
              raise SystemExit(f"expected exactly two exported user turns, got {user_indexes!r} roles={roles!r}")

          first_user_index, second_user_index = user_indexes
          if first_user_index >= second_user_index:
              raise SystemExit(f"invalid user turn order: {user_indexes!r}")

          first_assistants = [
              text for role, text in role_messages[first_user_index + 1:second_user_index]
              if role == "assistant"
          ]
          second_assistants = [
              text for role, text in role_messages[second_user_index + 1:]
              if role == "assistant"
          ]
          if not first_assistants:
              raise SystemExit(f"no assistant response between user turns: {roles!r}")
          if not second_assistants:
              raise SystemExit(f"no assistant response after second user turn: {roles!r}")

          turn1_user = role_messages[first_user_index][1]
          turn1_assistant = first_assistants[-1]
          turn2_user = role_messages[second_user_index][1]
          turn2_assistant = second_assistants[-1]

          if "synthetic OpenCode session-continuity diagnostic" not in turn1_user:
              raise SystemExit("first exported user turn marker missing")
          if token not in turn1_user:
              raise SystemExit("runtime continuity token missing from first exported user turn")
          if '"state": "waiting_for_followup"' not in turn1_assistant:
              raise SystemExit("first exported assistant state missing")

          if "Continue this existing session." not in turn2_user:
              raise SystemExit("second exported user turn marker missing")
          if token in turn2_user:
              raise SystemExit("runtime token was re-injected into second user turn")
          if '"state": "continued_original_session"' not in turn2_assistant:
              raise SystemExit("second exported assistant continuation state missing")
          if token not in turn2_assistant:
              raise SystemExit("continued assistant did not recover runtime token")

          top_keys = sorted(exported)
          summary = {
              "session_id": sid,
              "session_list_contains_session": True,
              "export_contains_session_id": True,
              "export_top_level_type": type(exported).__name__,
              "export_top_level_keys": top_keys,
              "role_sequence": roles,
              "ordered_two_turn_transcript": True,
              "user_turn_count": 2,
              "assistant_messages_between_turns": len(first_assistants),
              "assistant_messages_after_second_turn": len(second_assistants),
              "first_user_contains_runtime_token": True,
              "second_user_reinjects_runtime_token": False,
              "second_assistant_recovers_runtime_token": True,
              "token_sha256": hashlib.sha256(token.encode()).hexdigest(),
          }
          pathlib.Path(sys.argv[5]).write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("OpenCode persisted the continued session as an ordered two-turn user/assistant transcript")
          PY

