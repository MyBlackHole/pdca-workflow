name: OpenCode Compatibility Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "AGENTS.md"
      - "opencode.json"
      - "skills/**"
      - "ontology/INDEX.md"
      - "ontology/LOAD-MAP.md"
      - "ontology/contracts/agent-dispatch.md"
      - "ontology/contracts/entry-recovery.md"
      - "ontology/contracts/project-workspace.md"
      - "ontology/process/work-scenarios.md"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "AGENTS.md"
      - "opencode.json"
      - "skills/**"
      - "ontology/INDEX.md"
      - "ontology/LOAD-MAP.md"
      - "ontology/contracts/agent-dispatch.md"
      - "ontology/contracts/entry-recovery.md"
      - "ontology/contracts/project-workspace.md"
      - "ontology/process/work-scenarios.md"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-smoke:
    runs-on: ubuntu-latest
    # Three serial model probes can use up to 16 attempts at 180 seconds each
    # (48 minutes); leave time for installation, diagnostics, and artifact upload.
    timeout-minutes: 60
    env:
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "false"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "false"
      OPENCODE_VERSION: "1.18.32"
      OPENCODE_SHA256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set workspace-local OpenCode test paths
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_TEMP and GITHUB_ENV are injected by the GitHub Actions runner.
          # shellcheck disable=SC2153
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          case "$runner_temp" in
            /tmp|/tmp/*)
              echo "RUNNER_TEMP resolves under /tmp; refusing to create test files there: $runner_temp" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2153
          github_env="$(realpath -e "$GITHUB_ENV")"
          case "$github_env" in
            /tmp|/tmp/*)
              echo "GITHUB_ENV resolves under /tmp; refusing to write test configuration there: $github_env" >&2
              exit 1
              ;;
          esac
          test_home="$runner_temp/pdca-opencode-home"
          mkdir -p "$test_home"
          {
            printf 'TEST_HOME=%s\n' "$test_home"
            printf 'OPENCODE_TEST_HOME=%s\n' "$test_home"
            printf 'TMPDIR=%s\n' "$runner_temp"
          } >>"$GITHUB_ENV"

      - name: Classify public-model probe scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$CURRENT_SHA"
              ;;
            *)
              echo "run_model_probes=true" >>"$GITHUB_OUTPUT"
              echo "No reliable comparison range for $EVENT_NAME; running all public-model probes."
              exit 0
              ;;
          esac

          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "run_model_probes=true" >>"$GITHUB_OUTPUT"
              echo "Missing comparison base; running all public-model probes."
              exit 0
              ;;
          esac

          changes="$(git diff --name-only "$base" "$head")"
          printf 'Changed files:\n%s\n' "$changes"

          run_model_probes=false
          while IFS= read -r changed; do
            # Keep this list aligned with pull_request/push paths above and tests/README.md.
            case "$changed" in
              .github/workflows/opencode-smoke.yml|\
              AGENTS.md|\
              opencode.json|\
              skills/*|\
              ontology/INDEX.md|\
              ontology/LOAD-MAP.md|\
              ontology/contracts/agent-dispatch.md|\
              ontology/contracts/entry-recovery.md|\
              ontology/contracts/project-workspace.md|\
              ontology/process/work-scenarios.md|\
              ontology/projects/pdca-host-smoke/works/bounded-counter/*)
                run_model_probes=true
                break
                ;;
            esac
          done <<EOF
          $changes
          EOF

          echo "run_model_probes=$run_model_probes" >>"$GITHUB_OUTPUT"
          echo "Public-model probes: $run_model_probes"

      - name: Install PDCA and pin compatibility root to current checkout
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME"

          source_head="$(git rev-parse HEAD)"
          bundle="$RUNNER_TEMP/pdca-current-checkout.bundle"
          git bundle create "$bundle" HEAD

          # First execute the production installer unchanged. It intentionally
          # clones the public default branch, which validates real install/link
          # behavior but is not sufficient for PR Skill compatibility testing.
          sh ./install.sh

          installed_default_head="$(git -C "$HOME/.agents/pdca" rev-parse HEAD)"
          printf 'Production install head: %s\n' "$installed_default_head"
          printf 'Workflow checkout head: %s\n' "$source_head"

          # Keep the exact production layout/symlinks, but move only the
          # ephemeral CI checkout to this workflow's HEAD so all subsequent
          # OpenCode discovery/model probes exercise the actual PR/push bytes.
          git -C "$HOME/.agents/pdca" fetch "$bundle" HEAD
          git -C "$HOME/.agents/pdca" checkout --detach FETCH_HEAD

          installed_test_head="$(git -C "$HOME/.agents/pdca" rev-parse HEAD)"
          test "$installed_test_head" = "$source_head"
          test -z "$(git -C "$HOME/.agents/pdca" status --porcelain)"
          printf 'Compatibility test root pinned to workflow HEAD: %s\n' "$installed_test_head"

          mapfile -t expected < <(
            python3 - <<'PY'
          import json

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          for entry in catalog.get("skills", []):
              name = entry.get("name")
              if not isinstance(name, str) or not name:
                  raise SystemExit(f"invalid catalog Skill name: {name!r}")
              print(name)
          PY
          )
          [ "${#expected[@]}" -gt 0 ] || {
            echo "Runtime Skill catalog is empty." >&2
            exit 1
          }

          for skill in "${expected[@]}"; do
            test -L "$HOME/.agents/skills/$skill"
            test "$(readlink "$HOME/.agents/skills/$skill")" = "$HOME/.agents/pdca/skills/$skill"
            test -s "$HOME/.agents/skills/$skill/SKILL.md"
          done

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME/.opencode/bin" "$RUNNER_TEMP/opencode-download"
          archive="$RUNNER_TEMP/opencode-download/opencode-linux-x64.tar.gz"
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"

          curl -fL --retry 3 --retry-delay 2 -o "$archive" "$url"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Report OpenCode external-skill flags
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENCODE_DISABLE_EXTERNAL_SKILLS OPENCODE_DISABLE_CLAUDE_CODE_SKILLS OPENCODE_DISABLE_CLAUDE_CODE OPENCODE_PURE; do
            printf '%s=%s\n' "$name" "${!name-<unset>}"
          done

      - name: Verify OpenCode CLI discovers and parses PDCA skills
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"

          opencode debug skill >"$RUNNER_TEMP/opencode-debug-skills.json"
          cat "$RUNNER_TEMP/opencode-debug-skills.json"

          python3 - "$RUNNER_TEMP/opencode-debug-skills.json" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          expected = {
              entry.get("name")
              for entry in catalog.get("skills", [])
              if isinstance(entry, dict) and isinstance(entry.get("name"), str)
          }
          if not expected:
              raise SystemExit("runtime Skill catalog is empty")

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit(f"unexpected debug skill shape: {type(data).__name__}")

          by_name = {
              item.get("name"): item
              for item in data
              if isinstance(item, dict) and isinstance(item.get("name"), str)
          }
          discovered = set(by_name) & expected
          unexpected_pdca = {
              name
              for name in by_name
              if (name == "pdca" or name.startswith("pdca-")) and name not in expected
          }
          if discovered != expected or unexpected_pdca:
              raise SystemExit(
                  "OpenCode CLI PDCA discovery mismatch: "
                  f"expected={sorted(expected)} discovered={sorted(discovered)} "
                  f"unexpected_pdca={sorted(unexpected_pdca)}"
              )

          for name in sorted(expected):
              item = by_name[name]
              description = item.get("description")
              location = item.get("location", "")
              if not isinstance(description, str) or not description.strip():
                  raise SystemExit(f"{name}: description missing")
              if f"/.agents/skills/{name}/SKILL.md" not in location:
                  raise SystemExit(f"{name}: unexpected location {location!r}")

          pdca = by_name["pdca"]
          if "PDCA：定位、绑定与运行入口分流" not in pdca.get("content", ""):
              raise SystemExit("pdca Skill body marker missing")

          print(f"OpenCode CLI discovered and parsed all {len(expected)} catalogued PDCA runtime skills.")
          PY

      - name: Start OpenCode server for non-gating diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"
          opencode serve --hostname 127.0.0.1 --port 4096 >"$RUNNER_TEMP/opencode-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/opencode-server.pid"

          healthy=0
          for _ in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/api/health >"$RUNNER_TEMP/opencode-health.json"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/opencode-server.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/opencode-health.json"

      - name: Collect headless server skill-discovery diagnostic
        continue-on-error: true
        id: server_skill_discovery
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          curl -fsS \
            -H "x-opencode-directory: $GITHUB_WORKSPACE" \
            http://127.0.0.1:4096/api/skill \
            >"$RUNNER_TEMP/opencode-server-skills.json"
          cat "$RUNNER_TEMP/opencode-server-skills.json"

          python3 - "$RUNNER_TEMP/opencode-server-skills.json" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/catalog.json", encoding="utf-8"))
          expected = {
              entry.get("name")
              for entry in catalog.get("skills", [])
              if isinstance(entry, dict) and isinstance(entry.get("name"), str)
          }
          if not expected:
              raise SystemExit("runtime Skill catalog is empty")

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {item.get("name") for item in data.get("data", []) if isinstance(item, dict)}
          discovered = sorted(names & expected)
          print("headless server PDCA skills:", discovered)
          if set(discovered) != expected:
              raise SystemExit(
                  "Headless server instance did not expose all external PDCA skills; "
                  "this is diagnostic only. CLI compatibility is gated by opencode debug skill."
              )
          PY
      - name: Report provider boundary
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"

          present=()
          for name in OPENCODE_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY GEMINI_API_KEY; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "No provider credential is present in this job."
            echo "No credential-backed model execution is available; a public free-model diagnostic runs next."
          else
            echo "Provider credential presence detected (names only): ${present[*]}"
            echo "This smoke does not consume repository secrets automatically."
          fi

      - name: Probe two fresh public-model sessions from ontology core only
        if: steps.scope.outputs.run_model_probes == 'true'
        id: fresh_recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          unset OPENCODE_DISABLE_MODELS_FETCH
          cd "$GITHUB_WORKSPACE"

          python3 - \
            ontology/projects/pdca-host-smoke/works/bounded-counter/candidate-0.9.0/model.md \
            "$RUNNER_TEMP/bounded-counter-core-0.9.md" <<'PY'
          import pathlib
          import re
          import sys

          src = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "## 8. Derived work projection candidates"
          if marker not in src:
              raise SystemExit("bounded-counter projection marker missing")
          core = src.split(marker, 1)[0]
          allowed_oracle_references = {
              "AC-NODE-COUNTER-1..4": 1,
              "AC-NODE-LABEL-1..2": 1,
              "NODE-COUNTER acceptance oracle": 1,
          }
          unclassified_core = core
          for reference, expected_count in allowed_oracle_references.items():
              actual_count = unclassified_core.count(reference)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"unexpected projected-node oracle reference {reference!r}: "
                      f"expected {expected_count}, found {actual_count}"
                  )
              unclassified_core = unclassified_core.replace(reference, " ")
          leaks = sorted(set(re.findall(r"\bNODE-[A-Z0-9-]+\b", unclassified_core)))
          if leaks:
              raise SystemExit(f"derived-node declaration/projection leaked into ontology core: {leaks}")
          pathlib.Path(sys.argv[2]).write_text(core, encoding="utf-8")
          print("unapproved derived-node declarations/projection references: 0")
          PY

          cat >"$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt" <<'EOF'
          This is a synthetic compatibility test with no private data.
          First use the OpenCode skill tool to load the skill named `pdca`.
          After that Skill call, do not call any other tool; the attached ontology core is the only domain input.
          Do not modify files. Do not invent or assume any precomputed work-node identity.
          Use only the attached bounded-counter ontology core and traceability as domain evidence.

          Reconstruct the semantic work projection:
          - the unique composition root and component instances;
          - the producer/consumer dependency candidate and interface;
          - whether that dependency is ready;
          - the exact seven covered requirement IDs, including REQ-MODEL-SHAPE-001; keep REQ-SCOPE-001 only in the separate scope_coverage object;
          - the seeded counter state contract: initial state 0; increment results 1,2,2 from that initial state; read state nonmutation; reset-to-zero; keep operation result channels/meanings unknown where unspecified;
          - C-READ requires an independent state observation surface; its availability and any read return value remain unknown;
          - legal-reading label composition preserves N as count=N, while concrete operation mapping, call count, and freshness/reuse policy remain unknown;
          - negative out-of-range rejection observability remains unknown;
          - the unresolved source-scope requirement and unknown, without inventing persistence behavior or claiming full coverage;
          - one concise responsibility statement for each work instance.

          Output exactly one JSON object with this shape and no extra prose:
          Ensure strict JSON syntax and do not use a Markdown fence. Escape any double quote inside a string as `\"`, or paraphrase without quote characters.
          {
            "tree": {"root": "INST-SYSTEM", "children": ["INST-COUNTER", "INST-LABEL"]},
            "dependency": {
              "producer": "INST-COUNTER",
              "consumer": "INST-LABEL",
              "interface": "legal_count_value",
              "interface_contract": {
                "legal_reading_range": [0, 2],
                "formatter_preserves_value_as_label": true,
                "concrete_operation_mapping": "unknown",
                "read_invocation_count_policy": "unknown",
                "freshness_reuse_policy": "unknown"
              },
              "ready": false
            },
            "counter_contract": {
              "initial_state": 0,
              "increment_results_from_initial": [1, 2, 2],
              "read_state_effect": "non_mutating",
              "read_result_contract": "unknown",
              "read_state_observation_surface": "unknown",
              "reset_state_effect": "restores_to_zero",
              "reset_result_contract": "unknown",
              "reset_observation": "next_increment_result_1"
            },
            "scope_coverage": {
              "uncovered_requirements": ["REQ-SCOPE-001"],
              "unknowns": ["U-PERSISTENCE-SCOPE"],
              "all_requirements_covered": false,
              "persistence_semantics_resolved": false
            },
            "covered_requirements": [
              "REQ-BC-001",
              "REQ-BC-002",
              "REQ-BC-003",
              "REQ-BC-004",
              "REQ-LABEL-001",
              "REQ-COMP-001",
              "REQ-MODEL-SHAPE-001"
            ],
            "unknowns": [
              "U-READ-OBSERVABILITY",
              "U-OPERATION-RETURN-CONTRACT",
              "U-LABEL-READ-MAPPING",
              "U-LABEL-REJECTION-OBSERVABILITY",
              "U-PERSISTENCE-SCOPE"
            ],
            "responsibilities": {
              "INST-SYSTEM": "...",
              "INST-COUNTER": "...",
              "INST-LABEL": "..."
            },
            "limitations": ["..."]
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          run_one() {
            run="$1"
            success=0
            : >"$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            for model in "${models[@]}"; do
              echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              set +e
              timeout 180 opencode run \
                --model "$model" \
                --format json \
                --file "$RUNNER_TEMP/bounded-counter-core-0.9.md" \
                -- \
                "$(cat "$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt")" \
                >"$RUNNER_TEMP/opencode-fresh-$run.jsonl" \
                2>"$RUNNER_TEMP/opencode-fresh-$run.stderr"
              status=$?
              set -e
              cat "$RUNNER_TEMP/opencode-fresh-$run.stderr" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              if [ "$status" -eq 0 ]; then
                echo "$model" >"$RUNNER_TEMP/opencode-fresh-$run.model"
                echo "selected_model=$model" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
                success=1
                break
              fi
              echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            done
            if [ "$success" -ne 1 ]; then
              echo "No public free model completed fresh run $run."
              return 1
            fi
          }

          run_one run1
          run_one run2

          python3 - \
            "$RUNNER_TEMP/opencode-fresh-run1.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run2.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run1.model" \
            "$RUNNER_TEMP/opencode-fresh-run2.model" \
            "$RUNNER_TEMP/opencode-fresh-recovery-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          expected_children = {"INST-COUNTER", "INST-LABEL"}
          expected_instances = {"INST-SYSTEM", "INST-COUNTER", "INST-LABEL"}
          expected_covered_requirements = {
              "REQ-BC-001",
              "REQ-BC-002",
              "REQ-BC-003",
              "REQ-BC-004",
              "REQ-LABEL-001",
              "REQ-COMP-001",
              "REQ-MODEL-SHAPE-001",
          }
          expected_counter_contract = {
              "initial_state": 0,
              "increment_results_from_initial": [1, 2, 2],
              "read_state_effect": "non_mutating",
              "read_result_contract": "unknown",
              "read_state_observation_surface": "unknown",
              "reset_state_effect": "restores_to_zero",
              "reset_result_contract": "unknown",
              "reset_observation": "next_increment_result_1",
          }
          expected_unknowns = {
              "U-READ-OBSERVABILITY",
              "U-OPERATION-RETURN-CONTRACT",
              "U-LABEL-READ-MAPPING",
              "U-LABEL-REJECTION-OBSERVABILITY",
              "U-PERSISTENCE-SCOPE",
          }
          expected_scope_coverage = {
              "uncovered_requirements": ["REQ-SCOPE-001"],
              "unknowns": ["U-PERSISTENCE-SCOPE"],
              "all_requirements_covered": False,
              "persistence_semantics_resolved": False,
          }

          def load_run(path):
              events = []
              for line_number, line in enumerate(pathlib.Path(path).read_text(encoding="utf-8").splitlines(), start=1):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f"{path}:{line_number}: invalid OpenCode JSONL event: {exc}")

              skill_parts = []
              tool_names = []
              texts = []
              session_ids = set()
              for event in events:
                  sid = event.get("sessionID")
                  if isinstance(sid, str):
                      session_ids.add(sid)
                  if event.get("type") == "tool_use":
                      part = event.get("part") or {}
                      tool_names.append(part.get("tool"))
                      if part.get("tool") == "skill":
                          skill_parts.append(part)
                  if event.get("type") == "text":
                      part = event.get("part") or {}
                      value = part.get("text")
                      if isinstance(value, str) and value.strip():
                          texts.append(value.strip())

              if not skill_parts:
                  raise SystemExit(f"{path}: model did not call the skill tool")
              if not any("pdca" in json.dumps(part, ensure_ascii=False).lower() for part in skill_parts):
                  raise SystemExit(f"{path}: skill tool call did not reference pdca")
              unexpected_tools = [tool for tool in tool_names if tool != "skill"]
              if unexpected_tools:
                  raise SystemExit(f"{path}: unexpected tool access outside supplied ontology core: {unexpected_tools}")
              if tool_names.count("skill") != 1:
                  raise SystemExit(f"{path}: expected exactly one skill tool call, got {tool_names}")
              if len(session_ids) != 1:
                  raise SystemExit(f"{path}: expected exactly one session id, got {sorted(session_ids)}")
              if not texts:
                  raise SystemExit(f"{path}: no final text event")

              final = texts[-1]
              try:
                  obj = json.loads(final)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{path}: final answer must be exactly one JSON object: {exc}: {final!r}")
              if not isinstance(obj, dict):
                  raise SystemExit(f"{path}: final JSON value must be an object, got {type(obj).__name__}")

              if "scope_coverage" not in obj:
                  raise SystemExit(f"{path}: missing required scope_coverage")
              if set(obj) != {"tree", "dependency", "counter_contract", "scope_coverage", "covered_requirements", "unknowns", "responsibilities", "limitations"}:
                  raise SystemExit(f"{path}: unexpected top-level keys: {sorted(obj)}")

              tree = obj["tree"]
              if not isinstance(tree, dict) or set(tree) != {"root", "children"}:
                  raise SystemExit(f"{path}: tree shape mismatch: {tree!r}")
              if tree.get("root") != "INST-SYSTEM":
                  raise SystemExit(f"{path}: wrong tree root: {tree!r}")
              children = tree.get("children")
              if (not isinstance(children, list)
                      or len(children) != len(expected_children)
                      or not all(isinstance(item, str) for item in children)
                      or set(children) != expected_children):
                  raise SystemExit(f"{path}: wrong tree children: {tree!r}")

              counter_contract = obj["counter_contract"]
              if not isinstance(counter_contract, dict) or set(counter_contract) != set(expected_counter_contract):
                  raise SystemExit(f"{path}: counter contract shape mismatch: {counter_contract!r}")
              increment_results = counter_contract.get("increment_results_from_initial")
              if (not isinstance(increment_results, list)
                      or len(increment_results) != 3
                      or not all(type(item) is int for item in increment_results)):
                  raise SystemExit(f"{path}: increment results must be three JSON integers")
              if (type(counter_contract.get("initial_state")) is not int
                      or counter_contract.get("initial_state") != 0):
                  raise SystemExit(f"{path}: initial state must be JSON integer 0")
              for key in ("read_state_effect", "read_result_contract", "read_state_observation_surface",
                          "reset_state_effect", "reset_result_contract", "reset_observation"):
                  if not isinstance(counter_contract.get(key), str):
                      raise SystemExit(f"{path}: counter_contract.{key} must be a string")
              if counter_contract != expected_counter_contract:
                  raise SystemExit(
                      f"{path}: seeded counter/unknown contract mismatch: "
                      f"{counter_contract!r}"
                  )
              unknowns = obj["unknowns"]
              if (not isinstance(unknowns, list)
                      or len(unknowns) != len(expected_unknowns)
                      or not all(isinstance(item, str) for item in unknowns)
                      or set(unknowns) != expected_unknowns):
                  raise SystemExit(f"{path}: unknown set mismatch: {unknowns!r}")
              scope_coverage = obj["scope_coverage"]
              if not isinstance(scope_coverage, dict):
                  raise SystemExit(f"{path}: scope coverage mismatch: {scope_coverage!r}")
              for key in ("all_requirements_covered", "persistence_semantics_resolved"):
                  if type(scope_coverage.get(key)) is not bool:
                      raise SystemExit(f"{path}: scope_coverage.{key} must be a JSON boolean")
              if obj["scope_coverage"] != expected_scope_coverage:
                  raise SystemExit(f"{path}: scope coverage mismatch: {obj['scope_coverage']!r}")
              covered_requirements = obj["covered_requirements"]
              if (not isinstance(covered_requirements, list)
                      or len(covered_requirements) != len(expected_covered_requirements)
                      or not all(isinstance(item, str) for item in covered_requirements)
                      or set(covered_requirements) != expected_covered_requirements):
                  raise SystemExit(
                      f"{path}: covered requirement IDs mismatch: {covered_requirements!r}"
                  )

              dep = obj["dependency"]
              if not isinstance(dep, dict) or set(dep) != {
                  "producer", "consumer", "interface", "interface_contract", "ready"
              }:
                  raise SystemExit(f"{path}: dependency shape mismatch: {dep!r}")
              if not isinstance(dep.get("interface_contract"), dict) or set(dep["interface_contract"]) != {
                  "legal_reading_range", "formatter_preserves_value_as_label", "concrete_operation_mapping",
                  "read_invocation_count_policy", "freshness_reuse_policy"
              }:
                  raise SystemExit(f"{path}: dependency interface contract shape mismatch: {dep!r}")
              legal_range = dep["interface_contract"].get("legal_reading_range")
              if (not isinstance(legal_range, list) or len(legal_range) != 2
                      or not all(type(item) is int for item in legal_range)):
                  raise SystemExit(f"{path}: legal reading range must contain JSON integers")
              if type(dep["interface_contract"].get("formatter_preserves_value_as_label")) is not bool:
                  raise SystemExit(f"{path}: formatter_preserves_value_as_label must be a JSON boolean")
              if type(dep.get("ready")) is not bool:
                  raise SystemExit(f"{path}: dependency.ready must be a JSON boolean")
              expected_dep = {
                  "producer": "INST-COUNTER",
                  "consumer": "INST-LABEL",
                  "interface": "legal_count_value",
                  "interface_contract": {
                      "legal_reading_range": [0, 2],
                      "formatter_preserves_value_as_label": True,
                      "concrete_operation_mapping": "unknown",
                      "read_invocation_count_policy": "unknown",
                      "freshness_reuse_policy": "unknown",
                  },
                  "ready": False,
              }
              for key, value in expected_dep.items():
                  if dep.get(key) != value:
                      raise SystemExit(f"{path}: dependency {key} mismatch: {dep!r}")

              responsibilities = obj["responsibilities"]
              if not isinstance(responsibilities, dict):
                  raise SystemExit(f"{path}: responsibilities must be an object")
              if set(responsibilities) != expected_instances:
                  raise SystemExit(f"{path}: responsibility instances mismatch: {sorted(responsibilities)}")
              if not all(isinstance(v, str) and v.strip() for v in responsibilities.values()):
                  raise SystemExit(f"{path}: empty responsibility text")

              limitations = obj["limitations"]
              if (not isinstance(limitations, list) or not limitations
                      or not all(isinstance(item, str) and item.strip() for item in limitations)):
                  raise SystemExit(f"{path}: limitations must be a nonempty list of nonempty strings")

              normalized = {
                  "tree": {
                      "root": tree["root"],
                      "children": sorted(tree["children"]),
                  },
                  "dependency": expected_dep,
                  "counter_contract": expected_counter_contract,
                  "scope_coverage": expected_scope_coverage,
                  "covered_requirements": sorted(expected_covered_requirements),
                  "unknowns": sorted(expected_unknowns),
                  "responsibility_instances": sorted(responsibilities),
              }
              return next(iter(session_ids)), normalized, obj

          sid1, norm1, raw1 = load_run(sys.argv[1])
          sid2, norm2, raw2 = load_run(sys.argv[2])
          if sid1 == sid2:
              raise SystemExit(f"fresh runs reused the same session id: {sid1}")
          if norm1 != norm2:
              raise SystemExit(f"fresh-session normalized semantics differ: run1={norm1!r} run2={norm2!r}")

          summary = {
              "run1": {
                  "session_id": sid1,
                  "model": pathlib.Path(sys.argv[3]).read_text().strip(),
                  "answer": raw1,
              },
              "run2": {
                  "session_id": sid2,
                  "model": pathlib.Path(sys.argv[4]).read_text().strip(),
                  "answer": raw2,
              },
              "normalized_semantics": norm1,
              "same_semantics": True,
              "different_sessions": True,
          }
          pathlib.Path(sys.argv[5]).write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("two fresh OpenCode sessions recovered equivalent bounded-counter semantics")
          PY

      - name: Probe minimum label-child context in two fresh public-model sessions
