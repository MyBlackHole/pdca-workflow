name: OpenCode Compatibility Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "skills/**"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/opencode-smoke.yml"
      - "install.sh"
      - "skills/**"
      - "ontology/projects/pdca-host-smoke/works/bounded-counter/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_HOME: /tmp/pdca-opencode-home
      OPENCODE_TEST_HOME: /tmp/pdca-opencode-home
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "false"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "false"
      OPENCODE_VERSION: "1.18.32"
      OPENCODE_SHA256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDCA into isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME"
          sh ./install.sh

          expected=(pdca pdca-assist pdca-plan pdca-do pdca-check pdca-act pdca-model pdca-implement pdca-verify)
          for skill in "${expected[@]}"; do
            test -L "$HOME/.agents/skills/$skill"
            test "$(readlink "$HOME/.agents/skills/$skill")" = "$HOME/.agents/pdca/skills/$skill"
            test -s "$HOME/.agents/skills/$skill/SKILL.md"
          done

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          mkdir -p "$HOME/.opencode/bin" "$RUNNER_TEMP/opencode-download"
          archive="$RUNNER_TEMP/opencode-download/opencode-linux-x64.tar.gz"
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"

          curl -fL --retry 3 --retry-delay 2 -o "$archive" "$url"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Report OpenCode external-skill flags
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENCODE_DISABLE_EXTERNAL_SKILLS OPENCODE_DISABLE_CLAUDE_CODE_SKILLS OPENCODE_DISABLE_CLAUDE_CODE OPENCODE_PURE; do
            printf '%s=%s\n' "$name" "${!name-<unset>}"
          done

      - name: Verify OpenCode CLI discovers and parses PDCA skills
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"

          opencode debug skill >"$RUNNER_TEMP/opencode-debug-skills.json"
          cat "$RUNNER_TEMP/opencode-debug-skills.json"

          python3 - "$RUNNER_TEMP/opencode-debug-skills.json" <<'PY'
          import json
          import re
          import sys

          expected = {
              "pdca", "pdca-assist", "pdca-plan", "pdca-do", "pdca-check",
              "pdca-act", "pdca-model", "pdca-implement", "pdca-verify",
          }

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit(f"unexpected debug skill shape: {type(data).__name__}")

          by_name = {
              item.get("name"): item
              for item in data
              if isinstance(item, dict) and isinstance(item.get("name"), str)
          }
          discovered = {name for name in by_name if re.fullmatch(r"pdca(?:-[a-z]+)*", name)}
          if discovered != expected:
              raise SystemExit(
                  f"OpenCode CLI PDCA discovery mismatch: expected={sorted(expected)} discovered={sorted(discovered)}"
              )

          for name in sorted(expected):
              item = by_name[name]
              description = item.get("description")
              location = item.get("location", "")
              if not isinstance(description, str) or not description.strip():
                  raise SystemExit(f"{name}: description missing")
              if f"/.agents/skills/{name}/SKILL.md" not in location:
                  raise SystemExit(f"{name}: unexpected location {location!r}")

          pdca = by_name["pdca"]
          if "PDCA：定位、绑定与运行入口分流" not in pdca.get("content", ""):
              raise SystemExit("pdca Skill body marker missing")

          print("OpenCode CLI discovered and parsed all nine PDCA runtime skills.")
          PY

      - name: Start OpenCode server for non-gating diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          cd "$GITHUB_WORKSPACE"
          opencode serve --hostname 127.0.0.1 --port 4096 >"$RUNNER_TEMP/opencode-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/opencode-server.pid"

          healthy=0
          for _ in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/api/health >"$RUNNER_TEMP/opencode-health.json"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat "$RUNNER_TEMP/opencode-server.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/opencode-health.json"

      - name: Collect headless server skill-discovery diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          curl -fsS \
            -H "x-opencode-directory: $GITHUB_WORKSPACE" \
            http://127.0.0.1:4096/api/skill \
            >"$RUNNER_TEMP/opencode-server-skills.json"
          cat "$RUNNER_TEMP/opencode-server-skills.json"

          python3 - "$RUNNER_TEMP/opencode-server-skills.json" <<'PY'
          import json
          import sys

          expected = {
              "pdca", "pdca-assist", "pdca-plan", "pdca-do", "pdca-check",
              "pdca-act", "pdca-model", "pdca-implement", "pdca-verify",
          }
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {item.get("name") for item in data.get("data", []) if isinstance(item, dict)}
          discovered = sorted(names & expected)
          print("headless server PDCA skills:", discovered)
          if set(discovered) != expected:
              raise SystemExit(
                  "Headless server instance did not expose all external PDCA skills; "
                  "this is diagnostic only. CLI compatibility is gated by opencode debug skill."
              )
          PY
      - name: Report provider boundary
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"

          present=()
          for name in OPENCODE_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY GEMINI_API_KEY; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "No provider credential is present in this job."
            echo "No credential-backed model execution is available; a public free-model diagnostic runs next."
          else
            echo "Provider credential presence detected (names only): ${present[*]}"
            echo "This smoke does not consume repository secrets automatically."
          fi

      - name: Probe two fresh public-model sessions from ontology core only
        id: fresh_recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$TEST_HOME"
          unset OPENCODE_DISABLE_MODELS_FETCH
          cd "$GITHUB_WORKSPACE"

          python3 - \
            ontology/projects/pdca-host-smoke/works/bounded-counter/candidate-0.3.0/model.md \
            "$RUNNER_TEMP/bounded-counter-core-0.3.md" <<'PY'
          import pathlib
          import re
          import sys

          src = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = "## 8. Derived work projection candidates"
          if marker not in src:
              raise SystemExit("bounded-counter projection marker missing")
          core = src.split(marker, 1)[0]
          leaks = sorted(set(re.findall(r"\bNODE-[A-Z0-9-]+\b", core)))
          if leaks:
              raise SystemExit(f"derived NODE identity leaked into ontology core: {leaks}")
          pathlib.Path(sys.argv[2]).write_text(core, encoding="utf-8")
          print("ontology-core NODE identity leaks: 0")
          PY

          cat >"$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt" <<'EOF'
          This is a synthetic compatibility test with no private data.
          First use the OpenCode skill tool to load the skill named `pdca`.
          Do not modify files. Do not invent or assume any precomputed work-node identity.
          Use only the attached bounded-counter ontology core and traceability as domain evidence.

          Reconstruct the semantic work projection:
          - the unique composition root and component instances;
          - the producer/consumer dependency candidate and interface;
          - whether that dependency is ready;
          - one concise responsibility statement for each work instance.

          Output exactly one JSON object with this shape and no extra prose:
          {
            "tree": {"root": "INST-SYSTEM", "children": ["INST-COUNTER", "INST-LABEL"]},
            "dependency": {
              "producer": "INST-COUNTER",
              "consumer": "INST-LABEL",
              "interface": "legal_count_value",
              "ready": false
            },
            "responsibilities": {
              "INST-SYSTEM": "...",
              "INST-COUNTER": "...",
              "INST-LABEL": "..."
            },
            "limitations": ["..."]
          }
          EOF

          models=(
            opencode/mimo-v2.6-flash-free
            opencode/mimo-v2.5-free
            opencode/nemotron-3-ultra-free
          )

          run_one() {
            run="$1"
            success=0
            : >"$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            for model in "${models[@]}"; do
              echo "=== $model ===" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              set +e
              timeout 180 opencode run \
                --model "$model" \
                --format json \
                --file "$RUNNER_TEMP/bounded-counter-core-0.3.md" \
                -- \
                "$(cat "$RUNNER_TEMP/opencode-fresh-recovery-prompt.txt")" \
                >"$RUNNER_TEMP/opencode-fresh-$run.jsonl" \
                2>"$RUNNER_TEMP/opencode-fresh-$run.stderr"
              status=$?
              set -e
              cat "$RUNNER_TEMP/opencode-fresh-$run.stderr" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
              if [ "$status" -eq 0 ]; then
                echo "$model" >"$RUNNER_TEMP/opencode-fresh-$run.model"
                echo "selected_model=$model" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
                success=1
                break
              fi
              echo "exit_status=$status" | tee -a "$RUNNER_TEMP/opencode-fresh-$run-attempts.log"
            done
            if [ "$success" -ne 1 ]; then
              echo "No public free model completed fresh run $run."
              return 1
            fi
          }

          run_one run1
          run_one run2

          python3 - \
            "$RUNNER_TEMP/opencode-fresh-run1.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run2.jsonl" \
            "$RUNNER_TEMP/opencode-fresh-run1.model" \
            "$RUNNER_TEMP/opencode-fresh-run2.model" \
            "$RUNNER_TEMP/opencode-fresh-recovery-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          expected_children = {"INST-COUNTER", "INST-LABEL"}
          expected_instances = {"INST-SYSTEM", "INST-COUNTER", "INST-LABEL"}

          def load_run(path):
              events = []
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      events.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

              skill_parts = []
              texts = []
              session_ids = set()
              for event in events:
                  sid = event.get("sessionID")
                  if isinstance(sid, str):
                      session_ids.add(sid)
                  if event.get("type") == "tool_use":
                      part = event.get("part") or {}
                      if part.get("tool") == "skill":
                          skill_parts.append(part)
                  if event.get("type") == "text":
                      part = event.get("part") or {}
                      value = part.get("text")
                      if isinstance(value, str) and value.strip():
                          texts.append(value.strip())

              if not skill_parts:
                  raise SystemExit(f"{path}: model did not call the skill tool")
              if not any("pdca" in json.dumps(part, ensure_ascii=False).lower() for part in skill_parts):
                  raise SystemExit(f"{path}: skill tool call did not reference pdca")
              if len(session_ids) != 1:
                  raise SystemExit(f"{path}: expected exactly one session id, got {sorted(session_ids)}")
              if not texts:
                  raise SystemExit(f"{path}: no final text event")

              final = texts[-1]
              left = final.find("{")
              right = final.rfind("}")
              if left < 0 or right <= left:
                  raise SystemExit(f"{path}: final answer does not contain a JSON object: {final!r}")
              try:
                  obj = json.loads(final[left:right + 1])
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{path}: invalid final JSON: {exc}: {final!r}")

              if set(obj) != {"tree", "dependency", "responsibilities", "limitations"}:
                  raise SystemExit(f"{path}: unexpected top-level keys: {sorted(obj)}")

              tree = obj["tree"]
              if tree.get("root") != "INST-SYSTEM":
                  raise SystemExit(f"{path}: wrong tree root: {tree!r}")
              if set(tree.get("children") or []) != expected_children:
                  raise SystemExit(f"{path}: wrong tree children: {tree!r}")

              dep = obj["dependency"]
              expected_dep = {
                  "producer": "INST-COUNTER",
                  "consumer": "INST-LABEL",
                  "interface": "legal_count_value",
                  "ready": False,
              }
              for key, value in expected_dep.items():
                  if dep.get(key) != value:
                      raise SystemExit(f"{path}: dependency {key} mismatch: {dep!r}")

              responsibilities = obj["responsibilities"]
              if set(responsibilities) != expected_instances:
                  raise SystemExit(f"{path}: responsibility instances mismatch: {sorted(responsibilities)}")
              if not all(isinstance(v, str) and v.strip() for v in responsibilities.values()):
                  raise SystemExit(f"{path}: empty responsibility text")

              limitations = obj["limitations"]
              if not isinstance(limitations, list) or not limitations:
                  raise SystemExit(f"{path}: limitations must be a nonempty list")

              normalized = {
                  "tree": {
                      "root": tree["root"],
                      "children": sorted(tree["children"]),
                  },
                  "dependency": expected_dep,
                  "responsibility_instances": sorted(responsibilities),
              }
              return next(iter(session_ids)), normalized, obj

          sid1, norm1, raw1 = load_run(sys.argv[1])
          sid2, norm2, raw2 = load_run(sys.argv[2])
          if sid1 == sid2:
              raise SystemExit(f"fresh runs reused the same session id: {sid1}")
          if norm1 != norm2:
              raise SystemExit(f"fresh-session normalized semantics differ: run1={norm1!r} run2={norm2!r}")

          summary = {
              "run1": {
                  "session_id": sid1,
                  "model": pathlib.Path(sys.argv[3]).read_text().strip(),
                  "answer": raw1,
              },
              "run2": {
                  "session_id": sid2,
                  "model": pathlib.Path(sys.argv[4]).read_text().strip(),
                  "answer": raw2,
              },
              "normalized_semantics": norm1,
              "same_semantics": True,
              "different_sessions": True,
          }
          pathlib.Path(sys.argv[5]).write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("two fresh OpenCode sessions recovered equivalent bounded-counter semantics")
          PY

      - name: Dump OpenCode diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          export HOME="$TEST_HOME"
          opencode debug paths || true
          opencode debug config || true
          cat "$RUNNER_TEMP/opencode-server.log" || true

      - name: Upload OpenCode smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-compat-smoke
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/opencode-debug-skills.json
            ${{ runner.temp }}/opencode-health.json
            ${{ runner.temp }}/opencode-server-skills.json
            ${{ runner.temp }}/opencode-server.log
            ${{ runner.temp }}/bounded-counter-core-0.3.md
            ${{ runner.temp }}/opencode-fresh-recovery-prompt.txt
            ${{ runner.temp }}/opencode-fresh-run1.jsonl
            ${{ runner.temp }}/opencode-fresh-run1.stderr
            ${{ runner.temp }}/opencode-fresh-run1-attempts.log
            ${{ runner.temp }}/opencode-fresh-run1.model
            ${{ runner.temp }}/opencode-fresh-run2.jsonl
            ${{ runner.temp }}/opencode-fresh-run2.stderr
            ${{ runner.temp }}/opencode-fresh-run2-attempts.log
            ${{ runner.temp }}/opencode-fresh-run2.model
            ${{ runner.temp }}/opencode-fresh-recovery-summary.json
