# rdb.cfg 默认模板（由 rdb-cfg gen 生成，版本 1.0.0.0）
# 实际配置文件路径：/opt/aio/cfg/rdb.conf（运维常称 rdb.cfg，等价）
# 每个 [section]key 对应一个组件配置项（源：配置层 g_cfg_keys）
# 标记“必填”的项需部署前填写；其余缺省回落默认/协商


[security]
; 审计开关：操作日志是否落审计文件
; 未设置则回退 [auth]enable
; 可选值: 0=关闭, 1=开启
audit_enable=0
; 鉴权开关：连接是否校验时间密钥
; 未设置则回退 [auth]enable
; 可选值: 0=关闭, 1=开启
auth_enable=0
; 证书目录（各工具 mTLS 证书三件套所在）
; （全局回落层：各工具未设时生效）
; 最大长度: 4095
cert_dir=/opt/aio/cfg/certs/
; 全局 TLS 开关（各模块 mTLS 回落层）
; （全局回落层：各工具未设时生效）
; 可选值: 0=关闭, 1=开启
tls_enable=0
; 全局算法锁定；未设置=协商不限
; （全局回落层：各工具未设时生效）
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
# tls_algorithm = <可选，不设=协商/默认>

[auth]
; auth 主开关（时间密钥校验）
; （全局回落层：各工具未设时生效）
; 可选值: 0=关闭, 1=开启
enable=0

[libobk_server]
; libobk 服务端 mTLS 开关（独立配置）
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; libobk 服务端算法锁定；未设置=协商不限
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
# tls_algorithm = <可选，不设=协商/默认>

[libobk_client]
; libobk 客户端 mTLS 开关（独立配置）
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; libobk 客户端算法（默认 SM4_GCM_SM3）
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
tls_algorithm=TLS_SM4_GCM_SM3

[dmsbtex_server]
; dmsbtex 服务端 mTLS 开关（独立配置）
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; dmsbtex 服务端算法锁定；未设置=协商不限
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
# tls_algorithm = <可选，不设=协商/默认>

[dmsbtex_client]
; dmsbtex 客户端 mTLS 开关（独立配置）
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; dmsbtex 客户端算法（默认国密 SM4_GCM_SM3）
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
tls_algorithm=TLS_SM4_GCM_SM3

[aio-speedd]
; aio-speedd 服务端 mTLS 开关
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; aio-speedd 算法锁定；未设置=协商不限
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
# tls_algorithm = <可选，不设=协商/默认>
; rpc 数据校验开关（fail-closed：非 0/1 拒绝启动）
; 未设置则回退 [aio-speed]check_data
; 可选值: 0=关闭, 1=开启
check_data=0
; rpc 调试开关（fail-closed：非 0/1 拒绝启动）
; 未设置则回退 [aio-speed]debug
; 可选值: 0=关闭, 1=开启
debug=0
; rpc 保活心跳间隔（秒），非整数 fail-closed 拒绝
; 未设置则回退 [aio-speed]keepalive
; 值范围: [0, 9223372036854775807]
keepalive=30
; rpc 并发数，非整数 fail-closed 拒绝
; 未设置则回退 [aio-speed]parallel
; 值范围: [1, 9223372036854775807]
parallel=4
; rpc 读超时（毫秒），非整数 fail-closed 拒绝
; 未设置则回退 [aio-speed]read_timeout
; 值范围: [1, 9223372036854775807]
read_timeout=120000
; rpc 重试次数，非整数 fail-closed 拒绝
; 未设置则回退 [aio-speed]retry
; 值范围: [1, 9223372036854775807]
retry=3
; rpc fsbackup 设备路径；aio-speedd 优先，回落 aio-speed
; 未设置则回退 [aio-speed]fsbackup_dev_path
; 最大长度: 4095
fsbackup_dev_path=/dev/fsbackup

[aio-speed]
; aio-speed CLI mTLS 开关
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; aio-speed CLI 算法（默认 SM4_GCM_SM3）
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
tls_algorithm=TLS_SM4_GCM_SM3
; rpc 数据校验开关（fail-closed：非 0/1 拒绝启动）
; （全局回落层：各工具未设时生效）
; 可选值: 0=关闭, 1=开启
check_data=0
; rpc 调试开关（fail-closed：非 0/1 拒绝启动）
; （全局回落层：各工具未设时生效）
; 可选值: 0=关闭, 1=开启
debug=0
; rpc 保活心跳间隔（秒），非整数 fail-closed 拒绝
; （全局回落层：各工具未设时生效）
; 值范围: [0, 9223372036854775807]
keepalive=30
; rpc 并发数，非整数 fail-closed 拒绝
; （全局回落层：各工具未设时生效）
; 值范围: [1, 9223372036854775807]
parallel=4
; rpc 读超时（毫秒），非整数 fail-closed 拒绝
; （全局回落层：各工具未设时生效）
; 值范围: [1, 9223372036854775807]
read_timeout=120000
; rpc 重试次数，非整数 fail-closed 拒绝
; （全局回落层：各工具未设时生效）
; 值范围: [1, 9223372036854775807]
retry=3
; rpc fsbackup 设备路径（aio-speed 回落层）
; （全局回落层：各工具未设时生效）
; 最大长度: 4095
fsbackup_dev_path=/dev/fsbackup

[rdbcommd]
; rdbcommd 服务端 mTLS 开关
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; rdbcommd 算法锁定；未设置=协商不限
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
# tls_algorithm = <可选，不设=协商/默认>

[rdbcomm]
; rdbcomm 客户端 mTLS 开关
; 未设置则回退 [security]tls_enable
; 可选值: 0=关闭, 1=开启
tls_enable=0
; rdbcomm 客户端算法（默认 SM4_GCM_SM3）
; 未设置则回退 [security]tls_algorithm
; 可选值: TLS_SM4_GCM_SM3=国密SM4-GCM-SM3(TLS1.3), TLS_AES_256_GCM_SHA384=AES256-GCM-SHA384(国际/TLS1.3)
tls_algorithm=TLS_SM4_GCM_SM3

[fsdaemon]
; fsdeamon 数据校验开关（fail-closed：非 0/1 拒绝启动）
; 可选值: 0=关闭, 1=开启
check_data=0
; fsdeamon 调试开关（fail-closed：非 0/1 拒绝启动）
; 可选值: 0=关闭, 1=开启
debug=0
; fsdeamon 保活心跳间隔（秒），非整数 fail-closed 拒绝
; 值范围: [0, 9223372036854775807]
keepalive=30
; fsdeamon 重试次数，非整数 fail-closed 拒绝
; 值范围: [0, 9223372036854775807]
retry=3

[fsclient]
; fsclient 数据校验开关（fail-closed：非 0/1 拒绝启动）
; 可选值: 0=关闭, 1=开启
check_data=0
; fsclient 重试次数，非整数 fail-closed 拒绝
; 值范围: [0, 9223372036854775807]
retry=3
; fsclient 保活心跳间隔（秒），非整数 fail-closed 拒绝
; 值范围: [0, 9223372036854775807]
keepalive=30
; fsclient 读超时（毫秒），非整数 fail-closed 拒绝
; 值范围: [1, 9223372036854775807]
read_timeout=120000
; fsclient 并发数，非整数 fail-closed 拒绝
; 值范围: [1, 9223372036854775807]
parallel=1

[s3file]
; s3file 缓存目录，缺省回落 /tmp/s3-cache/
; 最大长度: 4095
cache_path=/tmp/s3-cache/
; s3file GmSSL 开关（fail-closed：非 0/1 拒绝启动）
; 可选值: 0=关闭, 1=开启
gmssl=0
; s3file 并发数，非整数 fail-closed 拒绝
; 值范围: [1, 9223372036854775807]
parallel=8

[s3mount]
; s3mount TLS 证书校验开关（默认不启用；fail-closed：非 0/1 拒绝）
; 可选值: 0=关闭, 1=开启
verify_ssl=0
; s3mount 缓存目录，缺省回落 /tmp/s3-cache/
; 最大长度: 4095
cache_path=/tmp/s3-cache/
; 值范围: [1, 9223372036854775807]
# cache_capacity = <必填，请填写>
; s3mount 日志路径，缺省回落 /opt/aio/logs/tools/s3mount/
; 最大长度: 4095
log_path=/opt/aio/logs/tools/s3mount/
; s3mount 挂载点，缺省回落 /fuse/
; 最大长度: 4095
fuse_mount_point=/fuse/
